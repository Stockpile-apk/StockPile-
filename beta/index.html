<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#1d2433">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>StockPile</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e5e7eb;--green:#15803d;--red:#b91c1c;--accent:#0f766e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--ink);color:#fff;padding:10px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header select{background:#1d2433;color:#fff;border:1px solid #6b7280;border-radius:999px;padding:7px 10px;font-size:14px;max-width:58%;text-overflow:ellipsis}
header button{background:none;border:1px solid #6b7280;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:14px 1px;border:0;background:none;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:22px 0 8px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.lbl{font-size:13px;color:var(--mute)}
.big{font-size:23px;font-weight:700;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}.mute{color:var(--mute);font-size:14px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.in{background:var(--green)}.btn.out{background:var(--red)}
.btn.sec{background:#e5e7eb;color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.end{justify-content:flex-end}.between{justify-content:space-between}
.bar{margin:14px 0}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .main{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600;overflow-wrap:anywhere}
.amt{font-weight:700;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.prod{margin-bottom:10px}
.prod .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qty{font-size:28px;font-weight:800;text-align:right;line-height:1}
.low{background:#fef2f2;border-color:#fecaca}
.empty{padding:22px 0;text-align:center;color:var(--mute)}
select.f,input.f{padding:8px;border-radius:8px;border:1px solid var(--line);font-size:15px;background:#fff}
.br{padding:9px 0}.track{height:8px;background:#eef0f3;border-radius:6px;margin-top:5px;overflow:hidden}.fill{height:100%;border-radius:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
#modal[hidden],#lock[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:16px}}
.fl{display:block;margin:12px 0}
.fl span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.fl input,.fl select{width:100%;padding:12px;font-size:17px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.fl input.bad{border-color:var(--red);background:#fef2f2}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.pf{display:flex;flex-direction:column;font-size:13px;color:var(--mute);flex:1;min-width:80px}
.pf input{width:100%;font-size:20px;padding:10px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:#f9fafb;border-radius:999px;padding:8px 12px;font-size:14px;color:var(--ink);cursor:pointer}
.chip.out0{opacity:.5}
.note.ok{background:#ecfdf5;border-color:#a7f3d0;font-weight:600}
.pk{width:24px;height:24px;flex:none}
.qb{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-size:20px;cursor:pointer}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
#lock{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock input{font-size:24px;text-align:center;letter-spacing:4px;padding:12px;border-radius:12px;border:0;width:200px;margin:18px 0 12px}
#lock a{color:#9ca3af;font-size:14px;margin-top:22px}
.reccode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:700;letter-spacing:1px;background:#f3f4f6;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;overflow-wrap:anywhere;margin:12px 0;color:#000;user-select:all}
#printArea{display:none}
.beta{background:#f59e0b;color:#1d2433;border-radius:6px;padding:2px 6px;font-size:11px;margin-left:6px;vertical-align:middle}
nav button[hidden]{display:none}
body.setup nav,body.setup header select{display:none}
.th{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#e5e7eb;flex:none;cursor:pointer}
.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cat{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.cat span{font-size:22px}
body.dark{--bg:#0f1420;--card:#1a2233;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2b3548;--green:#34d399;--red:#f87171;--accent:#2dd4bf}
body.dark header,body.dark #lock{background:#0b0f18}
body.dark nav,body.dark .list,body.dark .sheet,body.dark .fl input,body.dark .fl select,body.dark select.f,body.dark input.f,body.dark .qb{background:var(--card);color:var(--ink);border-color:var(--line)}
body.dark .btn{color:#06201c}body.dark .btn.in{color:#052e1b}body.dark .btn.out{color:#3b0a0a}body.dark .btn.sec{background:#2b3548;color:var(--ink)}
body.dark .note{background:#3a2f0b;border-color:#6b5a1a;color:#fde68a}body.dark .note.ok{background:#0f3326;border-color:#1f6b4f;color:#a7f3d0}
body.dark .low{background:#3b1414;border-color:#7f1d1d}body.dark .chip{background:#232d42;color:var(--ink);border-color:var(--line)}
body.dark .track{background:#2b3548}body.dark .fl input.bad{background:#3b1414}
body.dark .sheet .rc{color:var(--ink)}body.dark .sheet .rcs{color:var(--mute)}body.dark .sheet .rc th,body.dark .sheet .rc td{border-color:var(--line)}
.rc{color:#000;font-size:15px}.rch{font-size:20px;font-weight:800}.rcs{color:#444;font-size:14px;margin-top:2px}
.rc table{width:100%;border-collapse:collapse;margin:12px 0}.rc th,.rc td{text-align:left;padding:6px 4px;border-bottom:1px solid #ddd;font-size:14px}
.rc th:nth-child(n+2),.rc td:nth-child(n+2){text-align:right;white-space:nowrap}
.rct{display:flex;justify-content:space-between;padding:4px;font-size:16px}
.labs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lab{border:1px dashed #999;border-radius:4px;padding:6px;text-align:center;break-inside:avoid;page-break-inside:avoid;color:#000;background:#fff}
.ln{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lp{font-size:13px;font-weight:700}
@media print{body.printing>*{display:none!important}body.printing>#printArea{display:block!important;padding:24px;color:#000;background:#fff}}
</style>
</head>
<body>
<header id="hdr"></header>
<nav id="nav">
  <button data-t="home">Home</button>
  <button data-t="sell">Sell</button>
  <button data-t="money">Ledger</button>
  <button data-t="receipts">Receipts</button>
  <button data-t="stock">Stock</button>
  <button data-t="debts">Owing</button>
  <button data-t="more">More</button>
</nav>
<main id="view"></main>
<div id="modal" hidden></div>
<div id="lock" hidden>
  <div style="font-size:48px">📦</div>
  <div style="font-size:20px;font-weight:700;margin-top:6px">StockPile</div>
  <input id="pinIn" type="password" autocomplete="off" placeholder="PIN">
  <div class="row" style="justify-content:center"><button class="btn" id="pinGo">Unlock</button><button class="btn sec" id="bioGo" hidden>👆 Fingerprint</button></div>
  <div id="pinMsg" style="color:#fca5a5;height:20px;margin-top:10px;font-size:14px"></div>
  <a href="#" id="pinForgot">Forgot PIN?</a>
</div>
<div id="printArea"></div>
<input type="file" id="snapFile" accept="image/*" capture="environment" hidden>
<input type="file" id="pickFile" accept="image/*" hidden>
<input type="file" id="restoreFile" accept=".json,.txt,application/json,text/plain" hidden>

<script>
// The test copy (served from /beta/) keeps its data under separate names, so it can never touch the real app's data.
const BETA = /\/beta\//.test((typeof location !== 'undefined' && location.pathname) || '');
const KEY0 = (BETA ? 'beta_' : '') + 'money_inventory_tracker_v1', PKEY = (BETA ? 'beta_' : '') + 'stockpile_profiles';
const VERSION = '0.9.1';
const okDark = v => v === true || v === false ? v : undefined;
const fresh = () => ({ tx: [], items: [], debts: [], lastBackup: null, dirty: 0, auto: true, offRemind: true, lastSent: null, offSnooze: null, contacts: [], adj: [], rec: [], budgets: {}, staff: [], set: { gst: false, gstRate: 5 } });
const defaultP = () => ({ list: [{ id: 'default', name: 'My business' }], current: 'default' });
const CAN = !!(globalThis.crypto && crypto.subtle);
let S = fresh(), P = defaultP(), storageOK = true, loadFailed = false;
// DK: data key held in memory only while unlocked. SEC: encryption header (salt + wrapped key). LEGACY: old-style PIN hash.
let DK = null, SEC = null, LEGACY = null, saveQ = Promise.resolve();
const keyFor = id => id === 'default' ? KEY0 : KEY0 + '_' + id;
const profName = () => (P.list.find(p => p.id === P.current) || {}).name || 'My business';
const fileBase = () => 'stockpile-' + (profName().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'business') + '-backup';
// ----- keys -----
// DK is the master key (opened by the owner's PIN, recovery key, security answers or fingerprint).
// Every set of books has its own key. Ordinary books keep theirs inside the master-encrypted header (KEYS),
// so the owner's PIN opens them. Books with a private PIN keep theirs wrapped by that PIN only (SEC.priv).
// A staff PIN wraps the key of one business only (SEC.staff), so staff can never decrypt any other books.
let firstRun = false;
let KR = new Map(), KEYS = {}, staff = null, staffMode = false, saveGen = 0, dataReady = true;
const isPriv = pid => !!(SEC && SEC.priv && SEC.priv[pid]);
const needKey = () => !!SEC && !!DK && !staffMode && isPriv(P.current) && !KR.has(P.current);
function newKey(pid) { const raw = rnd(32); KEYS[pid] = b64(raw); KR.set(pid, importDK(raw)); }
const rawOf = async pid => KEYS[pid] || b64(await crypto.subtle.exportKey('raw', await KR.get(pid)));
const headerBody = () => JSON.stringify({ list: P.list, current: P.current, dark: P.dark, biz: P.biz, keys: KEYS });
const bizOn = () => P.biz !== false;
const can = perm => !staffMode || !!(staff && staff.perms && staff.perms[perm]);
async function loadProfile() {
  S = fresh(); loadFailed = false; dataReady = false;   // until the books are actually loaded, nothing may be saved over them
  if (needKey()) return;   // private books stay closed until their own PIN is entered
  try {
    const r = localStorage.getItem(keyFor(P.current));
    if (r) {
      let o = JSON.parse(r);
      if (o && o.enc === 2) o = JSON.parse(await dec(await KR.get(P.current), o));
      else if (o && o.enc) o = JSON.parse(await dec(DK, o));   // saved by an older version
      S = clean(o);
    }
  } catch (e) { loadFailed = true; }
  dataReady = true;
  if (S.set.pin && !SEC && !LEGACY) LEGACY = S.set.pin;
  delete S.set.pin;
  if (applyRecurring()) save();
}
function save() {
  if (loadFailed) return;
  const pid = P.current, sText = JSON.stringify(S);
  if (!SEC) {
    try { localStorage.setItem(keyFor(pid), sText); localStorage.setItem(PKEY, JSON.stringify({ list: P.list, current: P.current, dark: P.dark, biz: P.biz, pin: LEGACY })); } catch (e) { storageOK = false; }
    return;
  }
  const pk = dataReady ? KR.get(pid) : null, mk = DK, sec = SEC, body = mk && !staffMode ? headerBody() : null, gen = saveGen;
  if (!pk && !body) return;
  saveQ = saveQ.then(async () => {
    if (gen !== saveGen) return;   // everything was erased since this save was queued: don't write it back
    if (pk) localStorage.setItem(keyFor(pid), JSON.stringify({ enc: 2, ...await enc(await pk, sText) }));
    if (body) localStorage.setItem(PKEY, JSON.stringify({ sec, body: await enc(mk, body) }));
  }).catch(() => { storageOK = false; });
}

let tab = 'home', moneyFilter = 'month', moneyView = 'list', showNums = false, hiddenAt = 0;
const money = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const cur = n => money.format(n || 0);
const fmt = n => showNums || staffMode ? cur(n) : '$ •••';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const thisMonth = () => today().slice(0, 7);
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const round = n => Math.round(n * 100) / 100;
const niceDate = d => { try { return new Date(d + 'T12:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return d; } };
const ACCT = { cash: 'Cash', bank: 'Bank' };
const acct = t => t.acct || 'cash';
const acctBal = a => sum(S.tx, t => t.type === 'move' ? (t.from === a ? -t.amount : t.amount) : acct(t) !== a ? 0 : t.type === 'in' ? t.amount : -t.amount);
const gstOf = (amount, inc) => S.set.gst && inc ? round(amount * S.set.gstRate / (100 + S.set.gstRate)) : 0;
const eye = () => staffMode ? '' : `<button class="btn sec sm" onclick="showNums=!showNums;render()">${showNums ? '🙈 Hide amounts' : '👁 Show amounts'}</button>`;

/* ---------- safety: only accept well-formed data (from storage or a backup file) ---------- */
const num = v => { v = parseFloat(v); return Number.isFinite(v) ? v : 0; };
const str = v => v == null ? '' : String(v).slice(0, 300);
const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
const okDate = v => isDate(v) ? v : today();
const okId = v => typeof v === 'string' && /^[a-z0-9]{1,24}$/i.test(v) ? v : uid();
const arr = v => Array.isArray(v) ? v.filter(x => x && typeof x === 'object') : [];
function clean(d) {
  const o = fresh(); d = d && typeof d === 'object' ? d : {};
  o.tx = arr(d.tx).filter(t => ['in', 'out', 'move'].includes(t.type)).map(t => {
    const r = { id: okId(t.id), type: t.type, amount: num(t.amount), note: str(t.note), date: okDate(t.date) };
    if (t.type === 'move') r.from = t.from === 'bank' ? 'bank' : 'cash';
    else {
      r.cat = str(t.cat); r.acct = t.acct === 'bank' ? 'bank' : 'cash'; r.gst = num(t.gst);
      if (t.cust) r.cust = str(t.cust);
      if (t.cogs !== undefined) r.cogs = num(t.cogs);
      if (t.itemId) r.itemId = okId(t.itemId);
      if (t.qty !== undefined) r.qty = Math.round(num(t.qty));
      if (t.sale) r.sale = okId(t.sale);
      if (t.saleAmt !== undefined) r.saleAmt = num(t.saleAmt);
      if (t.disc) r.disc = num(t.disc);
      if (t.by) r.by = str(t.by).slice(0, 40);
      if (Array.isArray(t.pics)) { const pp = t.pics.filter(x => typeof x === 'string' && /^[a-z0-9]{1,24}$/i.test(x)).slice(0, 6); if (pp.length) r.pics = pp; }
      if (t.ret) { r.ret = okId(t.ret); if (t.line) r.line = okId(t.line); if (t.back) r.back = true; if (t.owedCut) r.owedCut = num(t.owedCut); }
    }
    return r;
  });
  o.items = arr(d.items).map(i => ({ id: okId(i.id), name: str(i.name), ...(cleanCode(i.code) ? { code: cleanCode(i.code) } : {}), num: Math.round(num(i.num)), cost: num(i.cost), price: num(i.price), qty: Math.round(num(i.qty)), low: Math.round(num(i.low)) }));
  const usedNums = new Set(); let nx = 1;
  o.items.forEach(i => { if (!(i.num >= 1) || usedNums.has(i.num)) i.num = 0; else usedNums.add(i.num); });
  o.items.forEach(i => { if (!i.num) { while (usedNums.has(nx)) nx++; i.num = nx; usedNums.add(nx); } });
  o.debts = arr(d.debts).map(x => { const r = { id: okId(x.id), name: str(x.name), dir: x.dir === 'owed' ? 'owed' : 'owe', amount: num(x.amount), note: str(x.note), date: okDate(x.date),
    payments: arr(x.payments).map(p => ({ amount: num(p.amount), date: okDate(p.date) })) }; if (x.sale) r.sale = okId(x.sale); if (isDate(x.due)) r.due = x.due; return r; });
  o.lastBackup = isDate(d.lastBackup) ? d.lastBackup : null;
  o.dirty = Math.max(0, Math.round(num(d.dirty))); o.auto = d.auto !== false;
  o.contacts = arr(d.contacts).map(c => ({ key: ckey(str(c.name)), name: str(c.name).trim(), phone: cleanPhone(c.phone), email: EMAIL_OK.test(str(c.email).trim()) ? str(c.email).trim().slice(0, 120) : '', promo: !!c.promo })).filter(c => c.key);
  o.adj = arr(d.adj).map(a => ({ id: okId(a.id), date: okDate(a.date), itemId: okId(a.itemId), name: str(a.name), qty: Math.round(num(a.qty)), why: str(a.why), note: str(a.note), value: num(a.value) }));
  o.rec = arr(d.rec).map(r => ({ id: okId(r.id), name: str(r.name), amount: num(r.amount), cat: str(r.cat), acct: r.acct === 'bank' ? 'bank' : 'cash', day: Math.min(Math.max(Math.round(num(r.day)) || 1, 1), 28), last: /^\d{4}-\d{2}$/.test(r.last) ? r.last : today().slice(0, 7) }));
  if (d.budgets && typeof d.budgets === 'object') Object.entries(d.budgets).slice(0, 80).forEach(([k, v]) => { if (num(v) > 0 && str(k)) o.budgets[str(k).slice(0, 60)] = num(v); });
  o.staff = arr(d.staff).map(x => ({ id: okId(x.id), who: str(x.who).slice(0, 40), perms: Object.fromEntries(['stock', 'stockEdit', 'owing', 'sales', 'refunds'].filter(k => x.perms && x.perms[k]).map(k => [k, true])) }));
  o.offRemind = d.offRemind !== false; o.lastSent = isDate(d.lastSent) ? d.lastSent : null; o.offSnooze = isDate(d.offSnooze) ? d.offSnooze : null;
  const st = d.set && typeof d.set === 'object' ? d.set : {};
  o.set = { gst: !!st.gst, gstRate: num(st.gstRate) || 5 };
  if (typeof st.pin === 'string' && /^[a-z0-9]{1,16}$/.test(st.pin)) o.set.pin = st.pin;
  return o;
}
function sanitizeP() {
  P.list = arr(P.list).filter(p => typeof p.id === 'string' && /^[a-z0-9]{1,24}$/i.test(p.id)).map(p => ({ id: p.id, name: str(p.name) || 'My business', ...(p.kind === 'personal' ? { kind: 'personal' } : {}) }));
  if (!P.list.length) P.list = defaultP().list;
  if (!P.list.some(p => p.id === P.current)) P.current = P.list[0].id;
}

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; posMsg = ''; selMode = false; sel.clear(); render(); window.scrollTo(0, 0); });

/* ---------- generic form popup ---------- */
function form(title, fields, onSave, extra = '', onDelete = null) {
  fields = fields.filter(Boolean);
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">${esc(title)}</h2><button class="x" id="fX" aria-label="Close" style="font-size:24px">✕</button></div>${extra}${fields.map(fieldHTML).join('')}

function closeForm() {

function fieldHTML(f) {

  if (f.t === 'select') return `<label class="fl"><span>${esc(f.l)}</span><select id="${id}">${f.o.map(o => `<option value="${esc(o[0])}" ${o[0] === val ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  let attrs = 'type="text"';
  if (f.t === 'money') attrs = 'type="number" step="0.01" min="0" inputmode="decimal"';
  if (f.t === 'number') attrs = 'type="number" step="1" inputmode="numeric"';

const acctField = (v, l) => ({ k: 'acct', l: l || 'Cash or bank?', t: 'select', v: v || 'cash', o: [['cash', 'Cash'], ['bank', 'Bank']] });

/* ---------- money ---------- */

function delTx(id) { if (staffMode) return;

  if (t.ret) {

  const sold = list.filter(t => !t.ret && t.itemId && t.qty > 0 && S.items.some(i => i.id === t.itemId));
  if (sold.length && confirm(`${sold.length} of these ${sold.length === 1 ? 'is a sale' : 'are sales'}. Put the sold items back in stock?`)) sold.forEach(t => { S.items.find(i => i.id === t.itemId).qty += t.qty; });
  dropPics(list);

}

/* ---------- recording a sale (full, part or pay-later) ---------- */
// lines: [{it, qty, price}]. Returns {total, paid, owing}, or a message string if something is missing.
// Only money actually received counts as Money In now; anything owing becomes a "They owe me" debt.
function recordSale(lines, o) {
  const T0 = round(sum(lines, l => round(l.qty * l.price))), disc = Math.min(Math.max(round(o.disc || 0), 0), T0), T = round(T0 - disc);
  let dLeft = disc;
  const net = lines.map((l, i) => { const f = round(l.qty * l.price), d = disc > 0 ? (i === lines.length - 1 ? dLeft : Math.min(dLeft, round(disc * f / T0))) : 0; dLeft = round(dLeft - d); return { full: round(f - d), d }; });
  let P = o.pay === 'later' ? 0 : o.pay === 'part' ? round(parseFloat(o.paid) || 0) : T;
  if (o.pay === 'part' && !(P > 0)) return 'Enter how much was paid now, or choose Pay later.';
  if (P > T) P = T;
  const owing = round(T - P), cust = String(o.cust || '').trim();
  if (owing > 0 && !cust) return 'Add the customer name, so the amount owing goes under their name on the Owing tab.';
  const sale = uid(), date = o.date || today(); let left = P;
  lines.forEach((l, i) => {
    const full = net[i].full;
    const cash = owing > 0 ? (i === lines.length - 1 ? left : Math.min(left, round(P * full / T))) : full;
    left = round(left - cash);
    l.it.qty -= l.qty;
    const t = { id: uid(), type: 'in', amount: round(cash), cat: 'Sales', note: `Sold ${l.qty} × ${l.it.name}`, cust, acct: o.acct === 'bank' ? 'bank' : 'cash', gst: gstOf(full, o.gstInc), date, cogs: round(l.qty * (l.it.cost || 0)), itemId: l.it.id, qty: l.qty, sale, ...(staffMode && staff ? { by: staff.who } : {}) };
    if (owing > 0) t.saleAmt = full;
    if (net[i].d > 0) t.disc = net[i].d;
    S.tx.push(t);
  });
  if (owing > 0) S.debts.push({ id: uid(), dir: 'owed', name: cust, amount: owing, note: 'Sale: ' + lines.map(l => `${l.qty} × ${l.it.name}`).join(', '), date, payments: [], sale, ...(isDate(o.due) ? { due: o.due } : {}) });
  return { total: T, paid: P, owing, sale };
}
const saleMsg = (r, cust) => r.owing > 0 ? `✓ Sale recorded: ${cur(r.total)}. Paid now ${cur(r.paid)}; ${cur(r.owing)} owing was added to the Owing tab under ${cust}.` : `✓ Sale recorded: ${cur(r.total)}`;
const PAYOPTS = [['full', 'Paid in full'], ['part', 'Part payment now'], ['later', 'Pay later (on account)']];

}

  const lines = cart.map(c => ({ c, it: S.items.find(i => i.id === c.id) })).filter(x => x.it);

  const cust = posCust.trim();
  const r = recordSale(lines.map(({ c, it }) => ({ it, qty: c.qty, price: c.price })), { cust, acct: posAcct, gstInc: posGst, pay: posPay, paid: posPaid, due: posDue, disc: cartTotals().disc });
  if (typeof r === 'string') { alert(r); return; }
  posMsg = saleMsg(r, cust); lastSale = r.sale; cart = []; posCust = ''; posPay = 'full'; posPaid = ''; posDue = ''; posDisc = '';
  commit(); render();
}

/* ---------- barcodes: make them (EAN-13 labels) and look products up by them ---------- */
const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
const EAN_P = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
const eanCheck = d12 => { let s = 0; for (let i = 0; i < 12; i++) s += (+d12[i]) * (i % 2 ? 3 : 1); return (10 - s % 10) % 10; };
// StockPile's own barcode for a product: "2" (the in-store range) + the item number + a check digit.
const itemEAN = n => { const b = '2' + String(n).padStart(11, '0'); return b + eanCheck(b); };
function eanBits(code) {
  const R = EAN_L.map(x => x.replace(/./g, c => c === '0' ? '1' : '0')), G = R.map(x => x.split('').reverse().join('')), p = EAN_P[+code[0]];
  let b = '101';
  for (let i = 0; i < 6; i++) b += (p[i] === 'L' ? EAN_L : G)[+code[i + 1]];
  b += '01010';
  for (let i = 7; i < 13; i++) b += R[+code[i]];
  return b + '101';
}
function eanSVG(code, h = 56) {
  const bits = eanBits(code), q = 11, w = bits.length + 2 * q; let rects = '', i = 0;
  while (i < bits.length) { if (bits[i] === '1') { let j = i; while (bits[j] === '1') j++; rects += `<rect x="${q + i}" y="2" width="${j - i}" height="${h}"/>`; i = j; } else i++; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h + 16}" style="width:100%;max-width:230px;background:#fff"><rect width="${w}" height="${h + 16}" fill="#fff"/><g fill="#000">${rects}</g><text x="${w / 2}" y="${h + 13}" font-size="10" font-family="monospace" text-anchor="middle" fill="#000">${code}</text></svg>`;
}

/* ---------- camera scanner ---------- */
let scan = null;
function stopScan() { if (scan) { clearTimeout(scan.timer); try { scan.stream.getTracks().forEach(t => t.stop()); } catch (e) {} scan = null; } }
async function startScan(mode, target) {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert("This phone's browser can't scan barcodes from here. Use the item number instead."); return; }
  stopScan();
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><h2>${mode === 'sell' ? 'Scan to sell' : 'Scan the barcode'}</h2>
    <video id="scanVid" playsinline muted style="width:100%;max-height:42vh;border-radius:12px;background:#000;object-fit:cover"></video>
    <div id="scanAsk" style="margin-top:10px"></div>
    <div id="scanMsg" class="note" style="margin-top:10px">Starting the camera…</div>
    <div class="row end"><button class="btn" onclick="closeForm()">Done</button></div></div>`;
  m.hidden = false; m.onclick = null;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const vid = $('#scanVid');
    if (!vid || $('#modal').hidden) { stream.getTracks().forEach(t => t.stop()); return; }
    vid.srcObject = stream; await vid.play();
    let formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
    try { const sup = await BarcodeDetector.getSupportedFormats(); formats = formats.filter(f => sup.includes(f)); } catch (e) {}
    const det = new BarcodeDetector({ formats });
    scan = { stream, mode, target, last: '', lastAt: 0, pending: null, timer: 0 };
    $('#scanMsg').textContent = 'Point the camera at a barcode.';
    const tick = async () => {
      if (!scan) return;
      try { if (!scan.pending) { const r = await det.detect(vid); if (scan && r.length) onScan(r[0].rawValue); } } catch (e) {}
      if (scan) scan.timer = setTimeout(tick, 250);
    };
    tick();
  } catch (e) { const el = $('#scanMsg'); if (el) el.textContent = "Couldn't open the camera. Allow camera access for StockPile, then try again."; }
}
function onScan(v) {
  if (!scan || scan.pending) return;
  const now = Date.now(); if (v === scan.last && now - scan.lastAt < 2500) return;
  scan.last = v; scan.lastAt = now;
  const msg = $('#scanMsg');
  if (scan.mode === 'sell') {
    const it = itemByCode(v);
    if (!it) { msg.textContent = `No product has the barcode ${cleanCode(v) || 'that was scanned'}. Add it from the Stock tab → Barcode.`; return; }
    scan.pending = it.id;
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    $('#scanAsk').innerHTML = `<div class="card"><div class="t">#${it.num} ${esc(it.name)}</div><div class="mute">${cur(it.price)} each · ${it.qty} in stock</div>
      <div class="row" style="margin-top:8px;align-items:flex-end"><label class="pf"><span>How many</span><input id="scanQty" class="f" type="number" inputmode="numeric" min="1" value="1" onkeydown="if(event.key==='Enter'){event.preventDefault();scanAdd()}"></label>
      <button class="btn in" onclick="scanAdd()">Add</button><button class="btn sec" onclick="scanResume('')">Skip</button></div></div>`;
    msg.textContent = 'Enter how many, then tap Add.';
    const q = $('#scanQty'); if (q) { q.focus(); if (q.select) q.select(); }
  } else {
    const it = S.items.find(i => i.id === scan.target), code = cleanCode(v), other = itemByCode(v);
    if (!it || !code) return;
    if (other && other.id !== it.id) { msg.textContent = `That barcode already belongs to ${other.name}.`; return; }
    it.code = code; closeForm(); commit(); render(); alert(`Barcode saved for ${it.name}. Scanning it on the Sell screen will now find this product.`);
  }
}
function scanAdd() {
  if (!scan || !scan.pending) return;
  const it = S.items.find(i => i.id === scan.pending), q = Math.max(1, Math.round(parseFloat($('#scanQty').value)) || 1);

function saleInfo(id) {
  const tx = S.tx.filter(t => t.sale === id); if (!id || !tx.length) return null;

  const disc = round(sum(tx, t => t.disc)), total = round(sum(lines, l => l.amount) - disc), owing = debt ? Math.max(bal(debt), 0) : 0;
  const returns = S.tx.filter(t => t.ret === id), returned = round(sum(returns, t => -(t.saleAmt || 0)));
  return { id, tx, debt, lines, total, owing, disc, returns, returned, paid: round(total - returned - owing), gst: round(sum(tx, t => t.gst)), date: tx[0].date, by: tx[0].by || '', cust: tx[0].cust || (debt ? debt.name : ''), no: 'R-' + tx[0].date.replace(/-/g, '') + '-' + id.slice(-4).toUpperCase() };

const smsLink = (phone, body) => 'sms:' + phone + '?body=' + encodeURIComponent(body);

// Ready-made wording. n = name, a = amount, d = due date (may be blank), B = business name.

function returnForm(id) { if (!can('refunds')) return;
  const r = saleInfo(id); if (!r) return;
  const lines = r.tx.map(t => { const sold = t.qty > 0 ? t.qty : 1, it = t.itemId && S.items.find(i => i.id === t.itemId); return { t, it, sold, name: it ? it.name : String(t.note || 'Item').replace(/^Sold \d+ × /, ''), left: sold - sum(r.returns.filter(x => x.line === t.id), x => x.qty) }; }).filter(l => l.left > 0);
  if (!lines.length) { alert('Everything on this sale has already been returned.'); return; }
  form('Return items', [
    ...lines.map((l, i) => ({ k: 'q' + i, l: `${l.name}: how many came back? (up to ${l.left})`, t: 'number', v: '', ph: '0' })),
    { k: 'back', l: 'Put the returned items back in stock', t: 'check', v: true },
    acctField('cash', 'Refund paid from')
  ], v => {
    const picks = lines.map((l, i) => ({ ...l, q: Math.min(Math.max(Math.round(v['q' + i]) || 0, 0), l.left) })).filter(l => l.q > 0);
    if (!picks.length) { alert('Enter how many of at least one item came back.'); return false; }
    let cutLeft = r.debt ? Math.max(bal(r.debt), 0) : 0, value = 0, cut = 0;
    for (const l of picks) {
      const full = l.t.saleAmt ?? l.t.amount, val = round(full * l.q / l.sold), c = Math.min(cutLeft, val);
      cutLeft = round(cutLeft - c); cut = round(cut + c); value = round(value + val);
      if (v.back && l.it) l.it.qty += l.q;
      S.tx.push({ id: uid(), type: 'out', amount: round(val - c), cat: 'Refund', note: `Returned ${l.q} × ${l.name}`, cust: r.cust, acct: v.acct, gst: -round((l.t.gst || 0) * l.q / l.sold), date: today(),
        cogs: -round((l.t.cogs || 0) * l.q / l.sold), saleAmt: -val, itemId: l.t.itemId, qty: l.q, ret: id, line: l.t.id, ...(v.back ? { back: true } : {}), ...(c > 0 ? { owedCut: c } : {}) });
    }
    if (cut > 0) r.debt.amount = round(r.debt.amount - cut);
    setTimeout(() => alert(`Return recorded: ${cur(value)}.` + (cut > 0 ? ` ${cur(cut)} came off what they owe.` : '') + (value - cut > 0 ? ` ${cur(round(value - cut))} refunded.` : '')), 80);
  }, `<div class="mute">The refund comes off what the customer still owes first. Anything beyond that is recorded as money paid back to them.</div>`);
}

/* ---------- recurring expenses (rent, phone, and so on) ---------- */
let recDay = '';
function applyRecurring() {
  if (loadFailed || !S.rec || !S.rec.length) return false;
  const now = today(), thisYm = now.slice(0, 7); let changed = false;
  for (const r of S.rec) {
    let [y, m] = String(r.last || thisYm).split('-').map(Number), guard = 0;
    while (guard++ < 24) {
      m++; if (m > 12) { m = 1; y++; }
      const ym = y + '-' + String(m).padStart(2, '0'); if (ym > thisYm) break;
      const date = ym + '-' + String(r.day).padStart(2, '0'); if (date > now) break;
      S.tx.push({ id: uid(), type: 'out', amount: r.amount, cat: r.cat, note: r.name, acct: r.acct, gst: 0, date });
      r.last = ym; changed = true;
    }
  }
  return changed;
}
function recurForm(id) {

  ], v => {

const CAT_HINTS = [['Fuel', /petro|\bshell\b|\besso\b|chevron|husky|co-?op gas|\bmobil\b|fas gas|gas bar|\bfuel\b|unleaded|diesel/i],

  ['Medical', /pharma|shoppers drug|london drugs|rexall|clinic|dental|optical/i], ['Pets', /petsmart|pet ?valu|bosley|veterinar|\bvet\b|pet food/i],
  ['Household', /home depot|\brona\b|canadian tire|\blowe'?s\b|home hardware|ikea|dollarama|hardware/i], ['Vehicle', /auto ?parts|lordco|\bnapa\b|\btires?\b|oil change|icbc|car wash|parking/i],

const bioOK = () => CAN && !!window.PublicKeyCredential && location.protocol === 'https:';
async function prfSecret(id, salt) {

  const r = cred.getClientExtensionResults();
  if (!r.prf || !r.prf.results || !r.prf.results.first) throw fail("This phone's fingerprint can't be used to unlock StockPile. Your PIN still works.");
  return crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', r.prf.results.first), 'AES-GCM', false, ['encrypt', 'decrypt']);
}
async function enableBio() {
  try {
    if (!SEC || !DK) throw fail('Set a PIN first.');
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32), rp: { name: 'StockPile' }, user: { id: rnd(16), name: 'StockPile', displayName: 'StockPile' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      timeout: 60000, extensions: { prf: {} } } });
    const ext = cred.getClientExtensionResults();

    const id = b64(cred.rawId), salt = b64(rnd(32));
    const k = await prfSecret(id, salt);

}
