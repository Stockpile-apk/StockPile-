name: Checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checks on the test copy
        run: node tests/run.js beta/index.html
      - name: Same checks, running as the test copy
        run: BETA=1 node tests/run.js beta/index.html
      - name: Checks on the main app, once it matches the test copy
        run: if cmp -s index.html beta/index.html; then node tests/run.js index.html; else echo 'Main app is on an earlier version; skipped.'; fi
