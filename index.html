<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#1d2433">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>StockPile</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e5e7eb;--green:#15803d;--red:#b91c1c;--accent:#0f766e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--ink);color:#fff;padding:10px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header button{background:none;border:1px solid #6b7280;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:14px 1px;border:0;background:none;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:22px 0 8px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.lbl{font-size:13px;color:var(--mute)}
.big{font-size:23px;font-weight:700;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}.mute{color:var(--mute);font-size:14px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.in{background:var(--green)}.btn.out{background:var(--red)}
.btn.sec{background:#e5e7eb;color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.end{justify-content:flex-end}.between{justify-content:space-between}
.bar{margin:14px 0}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .main{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600;overflow-wrap:anywhere}
.amt{font-weight:700;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.prod{margin-bottom:10px}
.prod .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qty{font-size:28px;font-weight:800;text-align:right;line-height:1}
.low{background:#fef2f2;border-color:#fecaca}
.empty{padding:22px 0;text-align:center;color:var(--mute)}
select.f,input.f{padding:8px;border-radius:8px;border:1px solid var(--line);font-size:15px;background:#fff}
.br{padding:9px 0}.track{height:8px;background:#eef0f3;border-radius:6px;margin-top:5px;overflow:hidden}.fill{height:100%;border-radius:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
#modal[hidden],#lock[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:16px}}
.fl{display:block;margin:12px 0}
.fl span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.fl input,.fl select{width:100%;padding:12px;font-size:17px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.fl input.bad{border-color:var(--red);background:#fef2f2}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.pf{display:flex;flex-direction:column;font-size:13px;color:var(--mute);flex:1;min-width:80px}
.pf input{width:100%;font-size:20px;padding:10px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:#f9fafb;border-radius:999px;padding:8px 12px;font-size:14px;color:var(--ink);cursor:pointer}
.chip.out0{opacity:.5}
.note.ok{background:#ecfdf5;border-color:#a7f3d0;font-weight:600}
.pk{width:24px;height:24px;flex:none}
.qb{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-size:20px;cursor:pointer}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
#lock{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock input{font-size:24px;text-align:center;letter-spacing:4px;padding:12px;border-radius:12px;border:0;width:200px;margin:18px 0 12px}
#lock a{color:#9ca3af;font-size:14px;margin-top:22px}
.reccode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:700;letter-spacing:1px;background:#f3f4f6;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;overflow-wrap:anywhere;margin:12px 0;color:#000;user-select:all}
#printArea{display:none}
.rc{color:#000;font-size:15px}.rch{font-size:20px;font-weight:800}.rcs{color:#444;font-size:14px;margin-top:2px}
.rc table{width:100%;border-collapse:collapse;margin:12px 0}.rc th,.rc td{text-align:left;padding:6px 4px;border-bottom:1px solid #ddd;font-size:14px}
.rc th:nth-child(n+2),.rc td:nth-child(n+2){text-align:right;white-space:nowrap}
.rct{display:flex;justify-content:space-between;padding:4px;font-size:16px}
.labs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lab{border:1px dashed #999;border-radius:4px;padding:6px;text-align:center;break-inside:avoid;page-break-inside:avoid;color:#000;background:#fff}
.ln{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lp{font-size:13px;font-weight:700}
@media print{body.printing>*{display:none!important}body.printing>#printArea{display:block!important;padding:24px;color:#000;background:#fff}}
</style>
</head>
<body>
<header id="hdr"></header>
<nav id="nav">
  <button data-t="home">Home</button>
  <button data-t="sell">Sell</button>
  <button data-t="money">Ledger</button>
  <button data-t="stock">Stock</button>
  <button data-t="debts">Owing</button>
  <button data-t="more">More</button>
</nav>
<main id="view"></main>
<div id="modal" hidden></div>
<div id="lock" hidden>
  <div style="font-size:48px">📦</div>
  <div style="font-size:20px;font-weight:700;margin-top:6px">StockPile</div>
  <input id="pinIn" type="password" autocomplete="off" placeholder="PIN">
  <div class="row" style="justify-content:center"><button class="btn" id="pinGo">Unlock</button><button class="btn sec" id="bioGo" hidden>👆 Fingerprint</button></div>
  <div id="pinMsg" style="color:#fca5a5;height:20px;margin-top:10px;font-size:14px"></div>
  <a href="#" id="pinForgot">Forgot PIN?</a>
</div>
<div id="printArea"></div>
<input type="file" id="restoreFile" accept=".json,.txt,application/json,text/plain" hidden>

<script>
const KEY0 = 'money_inventory_tracker_v1', PKEY = 'stockpile_profiles';
const VERSION = '10.2';
const fresh = () => ({ tx: [], items: [], debts: [], lastBackup: null, dirty: 0, auto: true, offRemind: true, lastSent: null, offSnooze: null, contacts: [], set: { gst: false, gstRate: 5 } });
const defaultP = () => ({ list: [{ id: 'default', name: 'My business' }], current: 'default' });
const CAN = !!(globalThis.crypto && crypto.subtle);
let S = fresh(), P = defaultP(), storageOK = true, loadFailed = false;
// DK: data key held in memory only while unlocked. SEC: encryption header (salt + wrapped key). LEGACY: old-style PIN hash.
let DK = null, SEC = null, LEGACY = null, saveQ = Promise.resolve();
const keyFor = id => id === 'default' ? KEY0 : KEY0 + '_' + id;
const profName = () => (P.list.find(p => p.id === P.current) || {}).name || 'My business';
const fileBase = () => 'stockpile-' + (profName().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'business') + '-backup';
async function loadProfile() {
  S = fresh(); loadFailed = false;
  try {
    const r = localStorage.getItem(keyFor(P.current));
    if (r) { let o = JSON.parse(r); if (o && o.enc) o = JSON.parse(await dec(DK, o)); S = clean(o); }
  } catch (e) { loadFailed = true; }
  if (S.set.pin && !SEC && !LEGACY) LEGACY = S.set.pin;
  delete S.set.pin;
}
function save() {
  if (loadFailed) return;
  const pid = P.current, sText = JSON.stringify(S), pBody = { list: P.list, current: P.current };
  if (!SEC) {
    try { localStorage.setItem(keyFor(pid), sText); localStorage.setItem(PKEY, JSON.stringify({ ...pBody, pin: LEGACY })); } catch (e) { storageOK = false; }
    return;
  }
  if (!DK) return;
  const key = DK, sec = SEC;
  saveQ = saveQ.then(async () => {
    const a = await enc(key, sText), b = await enc(key, JSON.stringify(pBody));
    localStorage.setItem(keyFor(pid), JSON.stringify({ enc: 1, ...a }));
    localStorage.setItem(PKEY, JSON.stringify({ sec, body: b }));
  }).catch(() => { storageOK = false; });
}

let tab = 'home', moneyFilter = 'month', moneyView = 'list', showNums = false, hiddenAt = 0;
const money = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const cur = n => money.format(n || 0);
const fmt = n => showNums ? cur(n) : '$ •••';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const thisMonth = () => today().slice(0, 7);
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const round = n => Math.round(n * 100) / 100;
const niceDate = d => { try { return new Date(d + 'T12:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return d; } };
const ACCT = { cash: 'Cash', bank: 'Bank' };
const acct = t => t.acct || 'cash';
const acctBal = a => sum(S.tx, t => t.type === 'move' ? (t.from === a ? -t.amount : t.amount) : acct(t) !== a ? 0 : t.type === 'in' ? t.amount : -t.amount);
const gstOf = (amount, inc) => S.set.gst && inc ? round(amount * S.set.gstRate / (100 + S.set.gstRate)) : 0;
const eye = () => `<button class="btn sec sm" onclick="showNums=!showNums;render()">${showNums ? '🙈 Hide amounts' : '👁 Show amounts'}</button>`;

/* ---------- safety: only accept well-formed data (from storage or a backup file) ---------- */
const num = v => { v = parseFloat(v); return Number.isFinite(v) ? v : 0; };
const str = v => v == null ? '' : String(v).slice(0, 300);
const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
const okDate = v => isDate(v) ? v : today();
const okId = v => typeof v === 'string' && /^[a-z0-9]{1,24}$/i.test(v) ? v : uid();
const arr = v => Array.isArray(v) ? v.filter(x => x && typeof x === 'object') : [];
function clean(d) {
  const o = fresh(); d = d && typeof d === 'object' ? d : {};
  o.tx = arr(d.tx).filter(t => ['in', 'out', 'move'].includes(t.type)).map(t => {
    const r = { id: okId(t.id), type: t.type, amount: num(t.amount), note: str(t.note), date: okDate(t.date) };
    if (t.type === 'move') r.from = t.from === 'bank' ? 'bank' : 'cash';
    else {
      r.cat = str(t.cat); r.acct = t.acct === 'bank' ? 'bank' : 'cash'; r.gst = num(t.gst);
      if (t.cust) r.cust = str(t.cust);
      if (t.cogs !== undefined) r.cogs = num(t.cogs);
      if (t.itemId) r.itemId = okId(t.itemId);
      if (t.qty !== undefined) r.qty = Math.round(num(t.qty));
      if (t.sale) r.sale = okId(t.sale);
      if (t.saleAmt !== undefined) r.saleAmt = num(t.saleAmt);
    }
    return r;
  });
  o.items = arr(d.items).map(i => ({ id: okId(i.id), name: str(i.name), ...(cleanCode(i.code) ? { code: cleanCode(i.code) } : {}), num: Math.round(num(i.num)), cost: num(i.cost), price: num(i.price), qty: Math.round(num(i.qty)), low: Math.round(num(i.low)) }));
  const usedNums = new Set(); let nx = 1;
  o.items.forEach(i => { if (!(i.num >= 1) || usedNums.has(i.num)) i.num = 0; else usedNums.add(i.num); });
  o.items.forEach(i => { if (!i.num) { while (usedNums.has(nx)) nx++; i.num = nx; usedNums.add(nx); } });
  o.debts = arr(d.debts).map(x => { const r = { id: okId(x.id), name: str(x.name), dir: x.dir === 'owed' ? 'owed' : 'owe', amount: num(x.amount), note: str(x.note), date: okDate(x.date),
    payments: arr(x.payments).map(p => ({ amount: num(p.amount), date: okDate(p.date) })) }; if (x.sale) r.sale = okId(x.sale); if (isDate(x.due)) r.due = x.due; return r; });
  o.lastBackup = isDate(d.lastBackup) ? d.lastBackup : null;
  o.dirty = Math.max(0, Math.round(num(d.dirty))); o.auto = d.auto !== false;
  o.contacts = arr(d.contacts).map(c => ({ key: ckey(str(c.name)), name: str(c.name).trim(), phone: cleanPhone(c.phone), email: EMAIL_OK.test(str(c.email).trim()) ? str(c.email).trim().slice(0, 120) : '', promo: !!c.promo })).filter(c => c.key);
  o.offRemind = d.offRemind !== false; o.lastSent = isDate(d.lastSent) ? d.lastSent : null; o.offSnooze = isDate(d.offSnooze) ? d.offSnooze : null;
  const st = d.set && typeof d.set === 'object' ? d.set : {};
  o.set = { gst: !!st.gst, gstRate: num(st.gstRate) || 5 };
  if (typeof st.pin === 'string' && /^[a-z0-9]{1,16}$/.test(st.pin)) o.set.pin = st.pin;
  return o;
}
function sanitizeP() {
  P.list = arr(P.list).filter(p => typeof p.id === 'string' && /^[a-z0-9]{1,24}$/i.test(p.id)).map(p => ({ id: p.id, name: str(p.name) || 'My business' }));
  if (!P.list.length) P.list = defaultP().list;
  if (!P.list.some(p => p.id === P.current)) P.current = P.list[0].id;
}

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; posMsg = ''; selMode = false; sel.clear(); render(); window.scrollTo(0, 0); });

/* ---------- generic form popup ---------- */
function form(title, fields, onSave, extra = '', onDelete = null) {
  fields = fields.filter(Boolean);
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">${esc(title)}</h2><button class="x" id="fX" aria-label="Close" style="font-size:24px">✕</button></div>${extra}${fields.map(fieldHTML).join('')}
    <div class="row between" style="margin-top:16px"><div class="row">${onDelete ? '<button class="btn out" id="fDel">Delete</button>' : ''}<button class="btn sec sm" id="fClear">Clear all</button></div>
      <div class="row"><button class="btn sec" id="fCancel">Cancel</button><button class="btn" id="fSave">Save</button></div></div></div>`;
  m.hidden = false;
  const first = m.querySelector('input:not([type=checkbox]),select'); if (first && fields[0].t !== 'select') setTimeout(() => first.focus(), 50);
  $('#fCancel').onclick = closeForm; $('#fX').onclick = closeForm;
  if (onDelete) $('#fDel').onclick = () => { closeForm(); onDelete(); };
  $('#fClear').onclick = () => { fields.forEach(f => { if (f.t !== 'select' && f.t !== 'check') { const el = document.getElementById('f_' + f.k); if (el) { el.value = ''; el.classList.remove('bad'); } } }); };
  m.onclick = e => { if (e.target === m) closeForm(); };
  $('#fSave').onclick = () => {
    const v = {};
    for (const f of fields) {
      const el = document.getElementById('f_' + f.k);
      if (f.t === 'check') { v[f.k] = el.checked; continue; }
      let val = el.value.trim();
      if (f.t === 'money' || f.t === 'number') { val = val === '' ? NaN : parseFloat(val); }
      const bad = f.req && (val === '' || Number.isNaN(val) || ((f.t === 'money' || f.t === 'number') && f.pos && val <= 0));
      if (bad) { el.classList.add('bad'); el.focus(); return; }
      if (Number.isNaN(val)) val = 0;
      v[f.k] = val;
    }
    if (onSave(v) !== false) { closeForm(); commit(); render(); }
  };
}
function closeForm() { const scanning = !!scan; stopScan(); $('#modal').hidden = true; $('#modal').innerHTML = ''; if (scanning) render(); }
function fieldHTML(f) {
  const id = 'f_' + f.k, val = f.v ?? '';
  if (f.t === 'check') return `<label class="chk"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${esc(f.l)}</label>`;
  if (f.t === 'select') return `<label class="fl"><span>${esc(f.l)}</span><select id="${id}">${f.o.map(o => `<option value="${esc(o[0])}" ${o[0] === val ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  let attrs = 'type="text"';
  if (f.t === 'money') attrs = 'type="number" step="0.01" min="0" inputmode="decimal"';
  if (f.t === 'number') attrs = 'type="number" step="1" inputmode="numeric"';
  if (f.t === 'date') attrs = 'type="date"';
  if (f.t === 'pin') attrs = 'type="password" autocomplete="off"';
  let list = '';
  if (f.list) { list = `<datalist id="dl_${f.k}">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`; attrs += ` list="dl_${f.k}"`; }
  return `<label class="fl"><span>${esc(f.l)}</span><input id="${id}" ${attrs} value="${esc(val)}" placeholder="${esc(f.ph || '')}">${list}</label>`;
}
const acctField = (v, l) => ({ k: 'acct', l: l || 'Cash or bank?', t: 'select', v: v || 'cash', o: [['cash', 'Cash'], ['bank', 'Bank']] });
const gstField = def => S.set.gst ? { k: 'gstInc', l: `Amount includes GST (${S.set.gstRate}%)`, t: 'check', v: def } : null;
function categories(type) {
  const base = type === 'in' ? ['Sales', 'Job payment', 'Other income'] : ['Inventory', 'Supplies', 'Gas', 'Tools', 'Rent', 'Phone', 'Food', 'Other'];
  const used = S.tx.filter(t => t.type === type).map(t => t.cat).filter(Boolean);
  return [...new Set([...used, ...base])];
}
const customers = () => [...new Set(S.tx.map(t => t.cust).filter(Boolean))];

/* ---------- money ---------- */
function addTx(type, t) {
  const isEdit = !!t, isIn = type === 'in';
  t = t || { date: today(), type, amount: '', cat: '', note: '', cust: '', acct: 'cash' };
  form((isEdit ? 'Edit ' : '') + (isIn ? 'Money In' : 'Money Out'), [
    { k: 'amount', l: 'Amount ($)', t: 'money', v: t.amount, req: 1, pos: 1, ph: '0.00' },
    { k: 'cat', l: 'Category', v: t.cat, list: categories(type), ph: isIn ? 'e.g. Sales' : 'e.g. Supplies' },
    isIn ? { k: 'cust', l: 'Customer (optional)', v: t.cust, list: customers() } : null,
    { k: 'note', l: 'Note (optional)', v: t.note, ph: 'What was it for?' },
    acctField(acct(t)),
    gstField(isEdit ? !!t.gst : false),
    { k: 'date', l: 'Date', t: 'date', v: t.date }
  ], v => {
    const data = { amount: round(v.amount), cat: v.cat, note: v.note, acct: v.acct, date: v.date || today(), gst: gstOf(round(v.amount), v.gstInc) };
    if (isIn) data.cust = v.cust;
    if (isEdit) Object.assign(t, data); else S.tx.push({ id: uid(), type, ...data });
  }, '', isEdit ? () => delTx(t.id) : null);
}
function addMove(t) {
  const isEdit = !!t;
  t = t || { date: today(), amount: '', from: 'cash', note: '' };
  form(isEdit ? 'Edit move' : 'Move money', [
    { k: 'from', l: 'Which way?', t: 'select', v: t.from, o: [['cash', 'Cash → Bank (deposit)'], ['bank', 'Bank → Cash (withdrawal)']] },
    { k: 'amount', l: 'Amount ($)', t: 'money', v: t.amount, req: 1, pos: 1, ph: '0.00' },
    { k: 'note', l: 'Note (optional)', v: t.note },
    { k: 'date', l: 'Date', t: 'date', v: t.date }
  ], v => {
    const data = { from: v.from, amount: round(v.amount), note: v.note, date: v.date || today() };
    if (isEdit) Object.assign(t, data); else S.tx.push({ id: uid(), type: 'move', ...data });
  }, '<div class="mute">For deposits and withdrawals. It shifts money between Cash and Bank without counting as income or spending.</div>', isEdit ? () => delTx(t.id) : null);
}
function editTx(id) { const t = S.tx.find(x => x.id === id); if (t) t.type === 'move' ? addMove(t) : addTx(t.type, t); }
function delTx(id) {

  if (debt && confirm(`This sale left ${cur(Math.max(bal(debt), 0))} owing from ${debt.name}. Remove that from the Owing tab too?`)) S.debts = S.debts.filter(d => d !== debt);

}

/* ---------- select several entries and delete them together ---------- */
let selMode = false, sel = new Set(), listIds = [];

  const list = S.tx.filter(t => sel.has(t.id)); if (!list.length) return;

  const sold = list.filter(t => t.itemId && t.qty > 0 && S.items.some(i => i.id === t.itemId));
  if (sold.length && confirm(`${sold.length} of these ${sold.length === 1 ? 'is a sale' : 'are sales'}. Put the sold items back in stock?`)) sold.forEach(t => { S.items.find(i => i.id === t.itemId).qty += t.qty; });
  S.tx = S.tx.filter(t => !sel.has(t.id));
  const gone = S.debts.filter(d => d.sale && list.some(t => t.sale === d.sale) && !S.tx.some(t => t.sale === d.sale));

}

/* ---------- recording a sale (full, part or pay-later) ---------- */
// lines: [{it, qty, price}]. Returns {total, paid, owing}, or a message string if something is missing.
// Only money actually received counts as Money In now; anything owing becomes a "They owe me" debt.
function recordSale(lines, o) {
  const T = round(sum(lines, l => round(l.qty * l.price)));
  let P = o.pay === 'later' ? 0 : o.pay === 'part' ? round(parseFloat(o.paid) || 0) : T;
  if (o.pay === 'part' && !(P > 0)) return 'Enter how much was paid now, or choose Pay later.';
  if (P > T) P = T;
  const owing = round(T - P), cust = String(o.cust || '').trim();
  if (owing > 0 && !cust) return 'Add the customer name, so the amount owing goes under their name on the Owing tab.';
  const sale = uid(), date = o.date || today(); let left = P;
  lines.forEach((l, i) => {
    const full = round(l.qty * l.price);
    const cash = owing > 0 ? (i === lines.length - 1 ? left : Math.min(left, round(P * full / T))) : full;
    left = round(left - cash);
    l.it.qty -= l.qty;
    const t = { id: uid(), type: 'in', amount: round(cash), cat: 'Sales', note: `Sold ${l.qty} × ${l.it.name}`, cust, acct: o.acct === 'bank' ? 'bank' : 'cash', gst: gstOf(full, o.gstInc), date, cogs: round(l.qty * (l.it.cost || 0)), itemId: l.it.id, qty: l.qty, sale };
    if (owing > 0) t.saleAmt = full;
    S.tx.push(t);
  });
  if (owing > 0) S.debts.push({ id: uid(), dir: 'owed', name: cust, amount: owing, note: 'Sale: ' + lines.map(l => `${l.qty} × ${l.it.name}`).join(', '), date, payments: [], sale, ...(isDate(o.due) ? { due: o.due } : {}) });
  return { total: T, paid: P, owing, sale };
}
const saleMsg = (r, cust) => r.owing > 0 ? `✓ Sale recorded: ${cur(r.total)}. Paid now ${cur(r.paid)}; ${cur(r.owing)} owing was added to the Owing tab under ${cust}.` : `✓ Sale recorded: ${cur(r.total)}`;
const PAYOPTS = [['full', 'Paid in full'], ['part', 'Part payment now'], ['later', 'Pay later (on account)']];

/* ---------- Sell screen (point of sale) ---------- */
let cart = [], posCust = '', posAcct = 'cash', posGst = true, posMsg = '', posPay = 'full', posPaid = '', posDue = '', lastSale = '';
function cartAdd(it, q) { const line = cart.find(c => c.id === it.id); if (line) line.qty += q; else cart.push({ id: it.id, qty: q, price: it.price }); posMsg = ''; lastSale = ''; }
const nextNum = () => Math.max(0, ...S.items.map(i => i.num || 0)) + 1;
const itemByNum = n => S.items.find(i => i.num === n);
function posPreview() {
  const v = $('#posNum').value, it = itemByNum(parseInt(v));

}

}

function posPrice(id) {
  const l = cart.find(c => c.id === id); if (!l) return;
  const v = prompt('Price each for this sale ($)', l.price); if (v === null) return;
  const n = parseFloat(v); if (Number.isFinite(n) && n >= 0) { l.price = round(n); render(); }
}
function posOwing() {
  const el = $('#posOwe'); if (!el) return;
  const T = round(sum(cart, c => round(c.qty * c.price))), P = Math.min(round(parseFloat(posPaid) || 0), T);
  el.textContent = posPay === 'later' ? `${cur(T)} will be added to Owing → Owed to me.` : posPay === 'part' ? `${cur(round(T - P))} will be added to Owing → Owed to me.` : '';
}
function posClear() { if (cart.length && confirm('Clear this sale?')) { cart = []; render(); } }
function posDone() {
  const lines = cart.map(c => ({ c, it: S.items.find(i => i.id === c.id) })).filter(x => x.it);
  if (!lines.length) return;
  const short = lines.filter(x => x.c.qty > x.it.qty);
  if (short.length && !confirm(`Not enough in stock for: ${short.map(x => `${x.it.name} (have ${x.it.qty})`).join(', ')}.\n\nRecord the sale anyway?`)) return;
  const cust = posCust.trim();
  const r = recordSale(lines.map(({ c, it }) => ({ it, qty: c.qty, price: c.price })), { cust, acct: posAcct, gstInc: posGst, pay: posPay, paid: posPaid, due: posDue });
  if (typeof r === 'string') { alert(r); return; }
  posMsg = saleMsg(r, cust); lastSale = r.sale; cart = []; posCust = ''; posPay = 'full'; posPaid = ''; posDue = '';
  commit(); render();
}

/* ---------- barcodes: make them (EAN-13 labels) and look products up by them ---------- */
const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
const EAN_P = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
const eanCheck = d12 => { let s = 0; for (let i = 0; i < 12; i++) s += (+d12[i]) * (i % 2 ? 3 : 1); return (10 - s % 10) % 10; };
// StockPile's own barcode for a product: "2" (the in-store range) + the item number + a check digit.
const itemEAN = n => { const b = '2' + String(n).padStart(11, '0'); return b + eanCheck(b); };
function eanBits(code) {
  const R = EAN_L.map(x => x.replace(/./g, c => c === '0' ? '1' : '0')), G = R.map(x => x.split('').reverse().join('')), p = EAN_P[+code[0]];
  let b = '101';
  for (let i = 0; i < 6; i++) b += (p[i] === 'L' ? EAN_L : G)[+code[i + 1]];
  b += '01010';
  for (let i = 7; i < 13; i++) b += R[+code[i]];
  return b + '101';
}
function eanSVG(code, h = 56) {
  const bits = eanBits(code), q = 11, w = bits.length + 2 * q; let rects = '', i = 0;
  while (i < bits.length) { if (bits[i] === '1') { let j = i; while (bits[j] === '1') j++; rects += `<rect x="${q + i}" y="2" width="${j - i}" height="${h}"/>`; i = j; } else i++; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h + 16}" style="width:100%;max-width:230px;background:#fff"><rect width="${w}" height="${h + 16}" fill="#fff"/><g fill="#000">${rects}</g><text x="${w / 2}" y="${h + 13}" font-size="10" font-family="monospace" text-anchor="middle" fill="#000">${code}</text></svg>`;
}
const cleanCode = v => { v = String(v ?? '').trim().replace(/[^0-9A-Za-z\-]/g, '').slice(0, 40); return /^0\d{12}$/.test(v) ? v.slice(1) : v; };
function itemByCode(v) {
  v = cleanCode(v); if (!v) return undefined;
  const own = S.items.find(i => i.code && i.code === v); if (own) return own;
  return /^2\d{12}$/.test(v) && +v[12] === eanCheck(v.slice(0, 12)) ? itemByNum(parseInt(v.slice(1, 12), 10)) : undefined;
}
function printLabels() {
  if (!S.items.length) return;
  const n = Math.min(Math.max(parseInt(prompt('How many labels for each product?', '1')) || 0, 0), 60); if (!n) return;
  const price = confirm('Show the price on each label?\n\nOK = show prices, Cancel = no prices');
  const items = [...S.items].sort((a, b) => a.num - b.num);
  printHTML(`<div class="labs">${items.map(i => Array(n).fill(`<div class="lab"><div class="ln">#${i.num} ${esc(i.name)}</div>${eanSVG(itemEAN(i.num))}${price ? `<div class="lp">${cur(i.price)}</div>` : ''}</div>`).join('')).join('')}</div>`);
}
function barcodeSheet(id) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><h2>Barcode: ${esc(it.name)}</h2>
    <div style="text-align:center">${eanSVG(itemEAN(it.num), 70)}</div>
    <p class="mute">This is StockPile's own barcode for item #${it.num}. Print it as a label and stick it on the product, then scan it on the Sell screen.</p>
    <div class="row"><button class="btn" onclick="printHTML(document.querySelector('#oneLab').innerHTML)">Print this label</button></div>
    <div id="oneLab" hidden><div class="labs"><div class="lab"><div class="ln">#${it.num} ${esc(it.name)}</div>${eanSVG(itemEAN(it.num))}</div></div></div>
    <h3>Product already has a barcode?</h3>
    <p class="mute">${it.code ? `Its own barcode is saved (<b>${esc(it.code)}</b>). Scanning either barcode finds this product.` : "If the packaging already has a barcode, scan it once and StockPile will recognise it from then on. No label needed."}</p>
    <div class="row"><button class="btn sec" onclick="startScan('assign','${it.id}')">📷 Scan its own barcode</button>${it.code ? `<button class="btn sec" onclick="clearCode('${it.id}')">Forget it</button>` : ''}</div>
    <div class="row end" style="margin-top:14px"><button class="btn sec" onclick="closeForm()">Close</button></div></div>`;

}
function clearCode(id) { const it = S.items.find(i => i.id === id); if (it) { delete it.code; closeForm(); commit(); render(); } }

/* ---------- camera scanner ---------- */
let scan = null;
function stopScan() { if (scan) { clearTimeout(scan.timer); try { scan.stream.getTracks().forEach(t => t.stop()); } catch (e) {} scan = null; } }
async function startScan(mode, target) {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert("This phone's browser can't scan barcodes from here. Use the item number instead."); return; }
  stopScan();
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><h2>${mode === 'sell' ? 'Scan to sell' : 'Scan the barcode'}</h2>
    <video id="scanVid" playsinline muted style="width:100%;max-height:42vh;border-radius:12px;background:#000;object-fit:cover"></video>
    <div id="scanAsk" style="margin-top:10px"></div>
    <div id="scanMsg" class="note" style="margin-top:10px">Starting the camera…</div>
    <div class="row end"><button class="btn" onclick="closeForm()">Done</button></div></div>`;
  m.hidden = false; m.onclick = null;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const vid = $('#scanVid');
    if (!vid || $('#modal').hidden) { stream.getTracks().forEach(t => t.stop()); return; }
    vid.srcObject = stream; await vid.play();
    let formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
    try { const sup = await BarcodeDetector.getSupportedFormats(); formats = formats.filter(f => sup.includes(f)); } catch (e) {}
    const det = new BarcodeDetector({ formats });
    scan = { stream, mode, target, last: '', lastAt: 0, pending: null, timer: 0 };
    $('#scanMsg').textContent = 'Point the camera at a barcode.';
    const tick = async () => {
      if (!scan) return;
      try { if (!scan.pending) { const r = await det.detect(vid); if (scan && r.length) onScan(r[0].rawValue); } } catch (e) {}
      if (scan) scan.timer = setTimeout(tick, 250);
    };
    tick();
  } catch (e) { const el = $('#scanMsg'); if (el) el.textContent = "Couldn't open the camera. Allow camera access for StockPile, then try again."; }
}
function onScan(v) {
  if (!scan || scan.pending) return;
  const now = Date.now(); if (v === scan.last && now - scan.lastAt < 2500) return;
  scan.last = v; scan.lastAt = now;
  const msg = $('#scanMsg');
  if (scan.mode === 'sell') {
    const it = itemByCode(v);
    if (!it) { msg.textContent = `No product has the barcode ${cleanCode(v) || 'that was scanned'}. Add it from the Stock tab → Barcode.`; return; }
    scan.pending = it.id;
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    $('#scanAsk').innerHTML = `<div class="card"><div class="t">#${it.num} ${esc(it.name)}</div><div class="mute">${cur(it.price)} each · ${it.qty} in stock</div>
      <div class="row" style="margin-top:8px;align-items:flex-end"><label class="pf"><span>How many</span><input id="scanQty" class="f" type="number" inputmode="numeric" min="1" value="1" onkeydown="if(event.key==='Enter'){event.preventDefault();scanAdd()}"></label>
      <button class="btn in" onclick="scanAdd()">Add</button><button class="btn sec" onclick="scanResume('')">Skip</button></div></div>`;
    msg.textContent = 'Enter how many, then tap Add.';
    const q = $('#scanQty'); if (q) { q.focus(); if (q.select) q.select(); }
  } else {
    const it = S.items.find(i => i.id === scan.target), code = cleanCode(v), other = itemByCode(v);
    if (!it || !code) return;
    if (other && other.id !== it.id) { msg.textContent = `That barcode already belongs to ${other.name}.`; return; }
    it.code = code; closeForm(); commit(); render(); alert(`Barcode saved for ${it.name}. Scanning it on the Sell screen will now find this product.`);
  }
}
function scanAdd() {
  if (!scan || !scan.pending) return;
  const it = S.items.find(i => i.id === scan.pending), q = Math.max(1, Math.round(parseFloat($('#scanQty').value)) || 1);
  if (it) cartAdd(it, q);
  scanResume(it ? `✓ Added ${q} × ${it.name}` : '');
}
function scanResume(m) {
  if (!scan) return;
  scan.pending = null; scan.lastAt = Date.now(); $('#scanAsk').innerHTML = '';
  const n = sum(cart, c => c.qty), T = sum(cart, c => c.qty * c.price);
  $('#scanMsg').textContent = (m ? m + '. ' : '') + (n ? `This sale so far: ${n} item${n > 1 ? 's' : ''}, ${cur(T)}. Scan the next one, or tap Done.` : 'Point the camera at a barcode.');
}

/* ---------- receipts and voiding a sale ---------- */
function saleInfo(id) {
  const tx = S.tx.filter(t => t.sale === id); if (!id || !tx.length) return null;
  const debt = S.debts.find(d => d.sale === id);
  const lines = tx.map(t => { const it = t.itemId && S.items.find(i => i.id === t.itemId), amount = t.saleAmt ?? t.amount, qty = t.qty > 0 ? t.qty : 1; return { name: it ? it.name : String(t.note || 'Item').replace(/^Sold \d+ × /, ''), qty, each: round(amount / qty), amount }; });
  const total = round(sum(lines, l => l.amount)), owing = debt ? Math.max(bal(debt), 0) : 0;
  return { id, tx, debt, lines, total, owing, paid: round(total - owing), gst: round(sum(tx, t => t.gst)), date: tx[0].date, cust: tx[0].cust || (debt ? debt.name : ''), no: 'R-' + tx[0].date.replace(/-/g, '') + '-' + id.slice(-4).toUpperCase() };
}
function receiptBody(r) {
  return `<div class="rc"><div class="rch">${esc(profName())}</div><div class="rcs">Receipt ${esc(r.no)} · ${niceDate(r.date)}</div>
    ${r.cust ? `<div class="rcs">Customer: <b>${esc(r.cust)}</b></div>` : ''}
    <table><tr><th>Item</th><th>Qty</th><th>Each</th><th>Amount</th></tr>${r.lines.map(l => `<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${cur(l.each)}</td><td>${cur(l.amount)}</td></tr>`).join('')}</table>

/* ---------- PIN lock + encryption ---------- */
function hashPin(p) { let h = 5381; const s = 'stockpile:' + p; for (let r = 0; r < 500; r++) for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i) ^ r) >>> 0; return h.toString(36); }

function b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); }

const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const fail = m => Object.assign(new Error(m), { userMsg: m });
const ITER = 600000;
async function pinKey(pin, salt, iter) {
  const km = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const importDK = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['encrypt', 'decrypt']);
async function enc(key, text) { const iv = rnd(12); return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(text))) }; }
async function dec(key, o) { return td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, key, unb64(o.ct))); }

// Turn encryption on. The header is written first, so a failure part-way leaves data readable.
async function enableEnc(pin) {
  save(); await saveQ;
  const raw = rnd(32), salt = rnd(16), key = await importDK(raw);
  const sec = { salt: b64(salt), iter: ITER, wrap: await enc(await pinKey(pin, salt, ITER), b64(raw)) };
  const body = await enc(key, JSON.stringify({ list: P.list, current: P.current }));
  localStorage.setItem(PKEY, JSON.stringify({ sec, body }));
  SEC = sec; DK = key; LEGACY = null;
  for (const p of P.list) {
    const r = localStorage.getItem(keyFor(p.id)); if (!r) continue;
    let o; try { o = JSON.parse(r); } catch (e) { continue; }
    if (o && !o.enc) localStorage.setItem(keyFor(p.id), JSON.stringify({ enc: 1, ...await enc(key, r) }));
  }
  save(); await saveQ;
}
async function unwrapWithPin(pin) {
  try { return unb64(await dec(await pinKey(pin, unb64(SEC.salt), SEC.iter), SEC.wrap)); } catch (e) { throw fail('That PIN is wrong.'); }
}
async function changePin(oldPin, newPin) {
  const raw = await unwrapWithPin(oldPin), salt = rnd(16);
  await saveQ;
  SEC = { ...SEC, salt: b64(salt), iter: ITER, wrap: await enc(await pinKey(newPin, salt, ITER), b64(raw)) };
  save(); await saveQ;
}
// Turn encryption off. Data is written back readable first, the header last.
async function removeEnc(pin) {
  await unwrapWithPin(pin);
  save(); await saveQ;
  for (const p of P.list) {
    const r = localStorage.getItem(keyFor(p.id)); if (!r) continue;
    let o; try { o = JSON.parse(r); } catch (e) { continue; }
    if (o && o.enc) localStorage.setItem(keyFor(p.id), await dec(DK, o));
  }
  SEC = null; DK = null; save();
}
async function openWith(raw) {
  const key = await importDK(raw), stored = JSON.parse(localStorage.getItem(PKEY));
  const body = JSON.parse(await dec(key, stored.body));
  DK = key; P = Object.assign(defaultP(), { list: body.list, current: body.current }); sanitizeP();
  await loadProfile();
}
function showLock() {
  showNums = false; closeForm();
  $('#lock').hidden = false; $('#pinIn').value = ''; $('#pinMsg').textContent = '';
  $('#bioGo').hidden = !(SEC && SEC.bio);
  setTimeout(() => $('#pinIn').focus(), 50);
}
function unlocked() { $('#lock').hidden = true; $('#pinIn').value = ''; $('#pinMsg').textContent = ''; render(); }
async function lockNow() {
  if (!SEC && !LEGACY) return;
  save(); await saveQ;
  if (SEC) { DK = null; S = fresh(); P = defaultP(); }
  resetView(); showLock(); render();
}
async function tryUnlock() {
  const pin = $('#pinIn').value; if (!pin) return;
  $('#pinMsg').textContent = 'Checking…';
  try {
    if (SEC) {
      if (!CAN) { $('#pinMsg').textContent = "This browser can't unlock StockPile. Open it in Chrome."; return; }
      await openWith(await unwrapWithPin(pin));
    } else {
      if (hashPin(pin) !== LEGACY) throw 0;
      if (CAN) { try { await enableEnc(pin); } catch (e) {} }

/* ---------- recovery key (a second way in if the PIN is forgotten) ---------- */
const RALPHA = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

const recKey = (code, salt) => pinKey(normRec(code), salt, 1000);

}

async function recoverWithKey(code, newPin) {

/* ---------- fingerprint unlock (installed/hosted version only) ---------- */
const bioOK = () => CAN && !!window.PublicKeyCredential && location.protocol === 'https:';
async function prfSecret(id, salt) {
  const cred = await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: unb64(id) }], userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: unb64(salt) } } } } });
  const r = cred.getClientExtensionResults();
  if (!r.prf || !r.prf.results || !r.prf.results.first) throw fail("This phone's fingerprint can't be used to unlock StockPile. Your PIN still works.");
  return crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', r.prf.results.first), 'AES-GCM', false, ['encrypt', 'decrypt']);
}
async function enableBio() {
  try {
    if (!SEC || !DK) throw fail('Set a PIN first.');
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32), rp: { name: 'StockPile' }, user: { id: rnd(16), name: 'StockPile', displayName: 'StockPile' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      timeout: 60000, extensions: { prf: {} } } });
    const ext = cred.getClientExtensionResults();
    if (!ext.prf || !ext.prf.enabled) throw fail("This phone's fingerprint can't be used to unlock StockPile. Your PIN still works.");
    const id = b64(cred.rawId), salt = b64(rnd(32));
    const k = await prfSecret(id, salt);
    SEC.bio = { id, salt, ...await enc(k, b64(await crypto.subtle.exportKey('raw', DK))) };
    save(); await saveQ; render(); alert('Fingerprint unlock is on. Your PIN still works too.');
  } catch (e) { alert((e && e.userMsg) || "Fingerprint unlock couldn't be set up on this phone. Your PIN still works."); }
}
function disableBio() { if (SEC && SEC.bio && confirm('Turn off fingerprint unlock?')) { delete SEC.bio; save(); render(); } }
async function bioUnlock() {
  try {
    $('#pinMsg').textContent = '';
    const k = await prfSecret(SEC.bio.id, SEC.bio.salt);
    await openWith(unb64(await dec(k, SEC.bio)));
    unlocked();
  } catch (e) { $('#pinMsg').textContent = "Fingerprint didn't work. Use your PIN."; }
}

/* ---------- backup / export ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// With a PIN set, backups are encrypted with the same key as the data (opened later with that PIN).
async function backupText(plain) {
  const s = JSON.stringify(S, null, 1);
  if (!SEC || !DK || plain) return s;
  return JSON.stringify({ stockpileBackup: 2, salt: SEC.salt, iter: SEC.iter, wrap: SEC.wrap, rec: SEC.rec, data: await enc(DK, s) });
}
async function backup(auto, plain) {
  if (plain && !confirm('An unlocked backup can be read by anyone who gets the file.\n\nIt is useful as a safety copy in case you forget your PIN, but keep it somewhere private.\n\nSave an unlocked backup?')) return;
  S.lastBackup = today(); S.dirty = 0; save();
  download(`${fileBase()}${plain ? '-UNLOCKED' : ''}-${today()}.json`, await backupText(plain), 'application/json');
  if (!auto) render();
}
function commit() {
  S.dirty = (S.dirty || 0) + 1; save();
  if (S.auto !== false && S.lastBackup !== today() && (S.tx.length || S.items.length || S.debts.length)) backup(true);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
}
async function shareBackup() {
  try {
    const f = new File([await backupText()], `${fileBase()}-${today()}.txt`, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], title: 'StockPile backup' });
      S.lastBackup = today(); S.lastSent = today(); S.offSnooze = null; S.dirty = 0; save(); render(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  await backup();
  alert("This browser won't share straight from here, so the backup was saved to Downloads instead.\n\nTo send it: open My Files → Downloads, press and hold the newest stockpile backup file, then tap Share.");
}
async function openBackup(d, pin) {
  if (!d || d.stockpileBackup !== 2) return d;
  if (!CAN) throw fail("This browser can't open locked backups. Open StockPile in Chrome.");
  if (DK) { try { return JSON.parse(await dec(DK, d.data)); } catch (e) {} }
  if (pin == null) throw new Error('needpin');
  const iter = Math.min(Math.max(parseInt(d.iter) || 0, 1000), 2000000);
  let raw;
  try { raw = unb64(await dec(await pinKey(pin, unb64(d.salt), iter), d.wrap)); }
  catch (e) { if (!d.rec) throw e; raw = unb64(await dec(await recKey(pin, unb64(d.rec.salt)), d.rec)); }
  return JSON.parse(await dec(await importDK(raw), d.data));
}
function applyBackup(o) {
  if (!o || !Array.isArray(o.tx) || !Array.isArray(o.items) || !Array.isArray(o.debts)) throw fail("That file doesn't look like a StockPile backup.");
  S = clean(o); delete S.set.pin; loadFailed = false; save(); render(); alert('Backup restored.');
}
function restore() { $('#restoreFile').value = ''; $('#restoreFile').click(); }
async function restoreText(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { alert("That file doesn't look like a StockPile backup."); return; }
  if (!confirm(`Replace everything in "${profName()}" with this backup?`)) return;
  try { applyBackup(await openBackup(d)); }
  catch (e) {
    if (!e || e.message !== 'needpin') { alert((e && e.userMsg) || "That file doesn't look like a StockPile backup."); return; }
    form('This backup is locked', [{ k: 'pin', l: 'PIN (or recovery key) from when this backup was made', t: 'pin', req: 1 }], v => {
      const b = $('#fSave'); b.disabled = true; b.textContent = 'Working…';
      openBackup(d, v.pin).then(o => { closeForm(); applyBackup(o); }).catch(err => { b.disabled = false; b.textContent = 'Save'; alert((err && err.userMsg) || 'That did not open this backup.'); });

    });

}

function groupBy(arr, key) { const o = {}; arr.forEach(t => { const k = key(t) || 'Other'; o[k] = (o[k] || 0) + t.amount; }); return Object.entries(o).sort((a, b) => b[1] - a[1]); }
function bars(entries, color, f = fmt, open = false) {

    <div class="card" style="margin-bottom:12px"><b>GST</b>
      <label class="chk"><input type="checkbox" ${S.set.gst ? 'checked' : ''} onchange="S.set.gst=this.checked;save();render()"> Track GST</label>
      ${S.set.gst ? `<div class="row"><span class="mute">Rate %</span><input class="f" type="number" step="0.1" min="0" style="width:90px" value="${S.set.gstRate}" onchange="S.set.gstRate=parseFloat(this.value)||5;save()"></div>
      <p class="mute">Entries get an “Amount includes GST” tick box. Totals show under Ledger → Breakdown.</p>` : '<p class="mute">Off. Turn it on if you ever need it.</p>'}</div>
    <div class="card" style="margin-bottom:12px"><b>Open in Excel</b>
      <p class="mute">Download your lists as files that Excel or Google Sheets can open.</p>
      <div class="row"><button class="btn sec" onclick="exportMoney()">Ledger (.csv)</button><button class="btn sec" onclick="exportStock()">Stock list (.csv)</button></div></div>
    <div class="card"><b>Start over</b><p class="mute">Erases everything in the tracker.</p><button class="btn out" onclick="wipe()">Erase all data</button></div>
    <p class="mute" style="text-align:center;margin-top:18px">StockPile version ${VERSION}</p>`;
  }
};
function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#hdr').innerHTML = `<span>📦 StockPile</span><button onclick="profiles()">${esc(profName())} ▾</button>`;
  $('#view').innerHTML = V[tab]();
}
async function init() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (e) { storageOK = false; }
  if (raw && raw.sec && raw.body) { SEC = raw.sec; render(); showLock(); return; }
  if (raw && typeof raw === 'object') {
    P = Object.assign(defaultP(), { list: raw.list, current: raw.current });
    if (typeof raw.pin === 'string' && /^[a-z0-9]{1,16}$/.test(raw.pin)) LEGACY = raw.pin;
  }
  sanitizeP(); await loadProfile(); render();
  if (LEGACY) showLock();
}
const ready = init();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
