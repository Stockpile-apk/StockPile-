<style>
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--bg:#f3f4f6;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e5e7eb;--green:#15803d;--red:#b91c1c;--accent:#0f766e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--ink);color:#fff;padding:10px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header select{background:#1d2433;color:#fff;border:1px solid #6b7280;border-radius:999px;padding:7px 10px;font-size:14px;max-width:58%;text-overflow:ellipsis}
header button{background:none;border:1px solid #6b7280;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:14px 1px;border:0;background:none;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:22px 0 8px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.lbl{font-size:13px;color:var(--mute)}
.big{font-size:23px;font-weight:700;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}.amber{color:#b45309}.btn.paid{background:#dcfce7;color:var(--green)}.mute{color:var(--mute);font-size:14px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.in{background:var(--green)}.btn.out{background:var(--red)}
.btn.sec{background:#e5e7eb;color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.end{justify-content:flex-end}.between{justify-content:space-between}
.bar{margin:14px 0}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .main{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600;overflow-wrap:anywhere}
.amt{font-weight:700;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.prod{margin-bottom:10px}
.prod .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qty{font-size:28px;font-weight:800;text-align:right;line-height:1}
.low{background:#fef2f2;border-color:#fecaca}
.empty{padding:22px 0;text-align:center;color:var(--mute)}
select.f,input.f{padding:8px;border-radius:8px;border:1px solid var(--line);font-size:15px;background:#fff}
.br{padding:9px 0}.track{height:8px;background:#eef0f3;border-radius:6px;margin-top:5px;overflow:hidden}.fill{height:100%;border-radius:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
#modal[hidden],#lock[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:16px}}
.fl{display:block;margin:12px 0}
.fl span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.fl input,.fl select{width:100%;padding:12px;font-size:17px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.fl input.bad{border-color:var(--red);background:#fef2f2}
.lg{font-size:13px;color:var(--mute);margin-left:10px;white-space:nowrap}.lg i,.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.lg i.dash{height:0;width:14px;border-radius:0;border-top:2px dashed var(--mute)}
.viz{width:100%;height:auto;display:block;touch-action:manipulation}.viz text{fill:var(--mute);font-size:11px;font-family:inherit}.viz .gl{stroke:var(--line);stroke-width:1}.cap{font-size:13px;color:var(--mute);min-height:18px;margin-top:6px}.cap.on{color:var(--ink);font-weight:600;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.pf{display:flex;flex-direction:column;font-size:13px;color:var(--mute);flex:1;min-width:80px}
.pf input{width:100%;font-size:20px;padding:10px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

#lock a{color:#9ca3af;font-size:14px;margin-top:22px}
.reccode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:700;letter-spacing:1px;background:#f3f4f6;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;overflow-wrap:anywhere;margin:12px 0;color:#000;user-select:all}
#printArea{display:none}
.beta{background:#f59e0b;color:#1d2433;border-radius:6px;padding:2px 6px;font-size:11px;margin-left:6px;vertical-align:middle}
nav button[hidden]{display:none}
body.setup nav,body.setup header select{display:none}
.th{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#e5e7eb;flex:none;cursor:pointer}
.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cat{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.cat span{font-size:22px}
body.dark{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--bg:#0f1420;--card:#1a2233;--ink:#e6e9ef;--mute:#9aa3b2;--line:#2b3548;--green:#34d399;--red:#f87171;--accent:#2dd4bf}
body.dark header,body.dark #lock{background:#0b0f18}
body.dark nav,body.dark .list,body.dark .sheet,body.dark .fl input,body.dark .fl select,body.dark select.f,body.dark input.f,body.dark .qb{background:var(--card);color:var(--ink);border-color:var(--line)}
body.dark .amber{color:#fbbf24}body.dark .btn.paid{background:#0f3326;color:#a7f3d0}body.dark .btn{color:#06201c}body.dark .btn.in{color:#052e1b}body.dark .btn.out{color:#3b0a0a}body.dark .btn.sec{background:#2b3548;color:var(--ink)}
body.dark .note{background:#3a2f0b;border-color:#6b5a1a;color:#fde68a}body.dark .note.ok{background:#0f3326;border-color:#1f6b4f;color:#a7f3d0}
body.dark .low{background:#3b1414;border-color:#7f1d1d}body.dark .chip{background:#232d42;color:var(--ink);border-color:var(--line)}
body.dark .track{background:#2b3548}body.dark .fl input.bad{background:#3b1414}
body.dark .sheet .rc{color:var(--ink)}body.dark .sheet .rcs{color:var(--mute)}body.dark .sheet .rc th,body.dark .sheet .rc td{border-color:var(--line)}
.rc{color:#000;font-size:15px}.rch{font-size:20px;font-weight:800}.rcs{color:#444;font-size:14px;margin-top:2px}
.rc table{width:100%;border-collapse:collapse;margin:12px 0}.rc th,.rc td{text-align:left;padding:6px 4px;border-bottom:1px solid #ddd;font-size:14px}
.rc th:nth-child(n+2),.rc td:nth-child(n+2){text-align:right;white-space:nowrap}
.rct{display:flex;justify-content:space-between;padding:4px;font-size:16px}
.labs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lab{border:1px dashed #999;border-radius:4px;padding:6px;text-align:center;break-inside:avoid;page-break-inside:avoid;color:#000;background:#fff}
.ln{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lp{font-size:13px;font-weight:700}
@media print{body.printing>*{display:none!important}body.printing>#printArea{display:block!important;padding:24px;color:#000;background:#fff}}
</style>

<body>
<header id="hdr"></header>
<nav id="nav">
  <button data-t="home">Home</button>
  <button data-t="sell">Sell</button>
  <button data-t="money">Ledger</button>
  <button data-t="budget">Budget</button>

<main id="view"></main>

  <div style="font-size:48px">📦</div>
  <div style="font-size:20px;font-weight:700;margin-top:6px">StockPile</div>
  <input id="pinIn" type="password" autocomplete="off" placeholder="PIN">
  <div class="row" style="justify-content:center"><button class="btn" id="pinGo">Unlock</button><button class="btn sec" id="bioGo" hidden>👆 Fingerprint</button></div>
  <div id="pinMsg" style="color:#fca5a5;height:20px;margin-top:10px;font-size:14px"></div>

<input type="file" id="snapFile" accept="image/*" capture="environment" hidden>

<input type="file" id="restoreFile" accept=".json,.txt,application/json,text/plain" hidden>

<script>
// The test copy (served from /beta/) keeps its data under separate names, so it can never touch the real app's data.
const BETA = /\/beta\//.test((typeof location !== 'undefined' && location.pathname) || '');
const KEY0 = (BETA ? 'beta_' : '') + 'money_inventory_tracker_v1', PKEY = (BETA ? 'beta_' : '') + 'stockpile_profiles';
const VERSION = '3.16.0';
const okDark = v => v === true || v === false ? v : undefined;
const fresh = () => ({ tx: [], items: [], debts: [], lastBackup: null, dirty: 0, auto: true, offRemind: true, lastSent: null, offSnooze: null, contacts: [], adj: [], rec: [], budgets: {}, staff: [], gone: {}, mm: {}, learn: {}, cards: [], banks: [], house: [], goals: [], open: {}, set: { gst: false, gstRate: 5 } });
const defaultP = () => ({ list: [{ id: 'default', name: 'My business' }], current: 'default' });
const CAN = !!(globalThis.crypto && crypto.subtle);
let S = fresh(), P = defaultP(), storageOK = true, loadFailed = false;
// DK: data key held in memory only while unlocked. SEC: encryption header (salt + wrapped key). LEGACY: old-style PIN hash.
let DK = null, SEC = null, LEGACY = null, saveQ = Promise.resolve();
const keyFor = id => id === 'default' ? KEY0 : KEY0 + '_' + id;
const profName = () => (P.list.find(p => p.id === P.current) || {}).name || 'My business';
const fileBase = () => 'stockpile-' + (profName().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'business') + '-backup';
// ----- keys -----
// DK is the master key (opened by the owner's PIN, recovery key, security answers or fingerprint).
// Every set of books has its own key. Ordinary books keep theirs inside the master-encrypted header (KEYS),
// so the owner's PIN opens them. Books with a private PIN keep theirs wrapped by that PIN only (SEC.priv).
// A staff PIN wraps the key of one business only (SEC.staff), so staff can never decrypt any other books.
let firstRun = false;
let KR = new Map(), KEYS = {}, staff = null, staffMode = false, saveGen = 0, dataReady = true;
const isPriv = pid => !!(SEC && SEC.priv && SEC.priv[pid]);
const needKey = () => !!SEC && !!DK && !staffMode && isPriv(P.current) && !KR.has(P.current);
function newKey(pid) { const raw = rnd(32); KEYS[pid] = b64(raw); KR.set(pid, importDK(raw)); }
const rawOf = async pid => KEYS[pid] || b64(await crypto.subtle.exportKey('raw', await KR.get(pid)));
const headerBody = () => JSON.stringify({ list: P.list, current: P.current, dark: P.dark, biz: P.biz, keys: KEYS });
const bizOn = () => P.biz !== false;
const can = perm => !staffMode || !!(staff && staff.perms && staff.perms[perm]);
async function loadProfile() {
  S = fresh(); loadFailed = false; dataReady = false; baseSnap = null;   // until the books are actually loaded, nothing may be saved over them
  if (needKey()) return;   // private books stay closed until their own PIN is entered
  try {
    const r = localStorage.getItem(keyFor(P.current));
    if (r) {
      let o = JSON.parse(r);
      if (o && o.enc === 2) o = JSON.parse(await dec(await KR.get(P.current), o));
      else if (o && o.enc) o = JSON.parse(await dec(DK, o));   // saved by an older version
      S = clean(o);
    }
  } catch (e) { loadFailed = true; }
  dataReady = true;
  if (S.set.pin && !SEC && !LEGACY) LEGACY = S.set.pin;
  delete S.set.pin;
  const grew = !loadFailed && prepSync(); if (!loadFailed) takeSnap();
  if (applyRecurring() || grew) save();
}
// How full this browser's storage is. Browsers allow roughly 5 million characters per site; receipt photos are kept elsewhere and don't count.
const STORE_CAP = 5e6;
function storageUse() {
  let used = 0;
  try { for (const k of Object.keys(localStorage)) used += k.length + String(localStorage.getItem(k) || '').length; } catch (e) {}
  return { used, cap: STORE_CAP, pct: Math.min(Math.round(used / STORE_CAP * 100), 100) };
}
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(Math.round(n / 1024), n ? 1 : 0) + ' KB';
function storageNote() {
  const u = storageUse(); if (u.pct < 70) return '';
  return `<div class="note">${u.pct >= 90 ? '⚠️ <b>Storage is almost full</b>' : '💾 Storage is filling up'}: ${u.pct}% used. ${u.pct >= 90 ? 'New entries may stop saving soon. Send a backup off this phone now.' : 'Send a backup off this phone so nothing is lost.'}
    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="shareBackup()">Send backup</button></div></div>`;
}
function storageCard() {
  const u = storageUse();
  return `<div class="card" style="margin-bottom:12px"><b>Storage on this phone</b>
    <p class="mute">${u.pct}% used: ${kb(u.used)} of about ${kb(u.cap)}, for all your books together. Receipt photos are stored separately and don't count.</p>
    <div class="track"><div class="fill" style="width:${Math.max(u.pct, 1)}%;background:${u.pct >= 90 ? 'var(--red)' : 'var(--accent)'}"></div></div>
    ${u.pct >= 70 ? '<p class="mute">Getting full. Keep a backup off this phone.</p>' : ''}</div>`;
}
function save() {
  if (loadFailed) return;
  const pid = P.current;
  if (!SEC) {
    stampChanges();
    try { localStorage.setItem(keyFor(pid), JSON.stringify(S)); localStorage.setItem(PKEY, JSON.stringify({ list: P.list, current: P.current, dark: P.dark, biz: P.biz, pin: LEGACY })); } catch (e) { storageOK = false; }
    linkNudge(); return;
  }
  const pk = dataReady ? KR.get(pid) : null, mk = DK, sec = SEC, body = mk && !staffMode ? headerBody() : null, gen = saveGen;
  if (!pk && !body) return;
  if (pk) stampChanges();
  const sText = pk ? JSON.stringify(S) : '';
  saveQ = saveQ.then(async () => {
    if (gen !== saveGen) return;   // everything was erased since this save was queued: don't write it back
    if (pk) localStorage.setItem(keyFor(pid), JSON.stringify({ enc: 2, ...await enc(await pk, sText) }));
    if (body) localStorage.setItem(PKEY, JSON.stringify({ sec, body: await enc(mk, body) }));
  }).catch(() => { storageOK = false; });
  if (pk) linkNudge();
}

let tab = 'home', moneyAcct = '', moneyFilter = 'month', moneyView = 'list', showNums = false, hiddenAt = 0;
const money = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const cur = n => money.format(n || 0);
const fmt = n => showNums || staffMode ? cur(n) : '$ •••';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const thisMonth = () => today().slice(0, 7);
// Date and time for file names, so two backups made on the same day never share a name.
const stamp = () => { const d = new Date(); return today() + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + String(d.getSeconds()).padStart(2, '0'); };
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const round = n => Math.round(n * 100) / 100;
const niceDate = d => { try { return new Date(d + 'T12:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return d; } };
// Accounts: cash, any number of bank accounts (debit) and credit cards. The first of each keeps the
// key older entries used ("bank", "credit"); more are "bk"/"cc" + an id.
const cardList = () => (S.cards || []).length ? S.cards : [{ id: 'credit', name: 'Credit card' }];
const bankList = () => (S.banks || []).length ? S.banks : [{ id: 'bank', name: 'Debit (bank)' }];
const isCard = a => a === 'credit' || /^cc[a-z0-9]{1,24}$/i.test(a || '');
const isBank = a => a === 'bank' || /^bk[a-z0-9]{1,24}$/i.test(a || '');
const cardName = c => c.name + (c.last4 ? ' ••' + c.last4 : '');
const acctName = a => isBank(a) ? cardName(bankList().find(c => c.id === a) || { name: 'Debit (bank)' }) : isCard(a) ? cardName(cardList().find(c => c.id === a) || { name: 'Credit card' }) : 'Cash';
const bankTotal = () => sum(bankList(), b => acctBal(b.id));
const bankTiles = () => bankList().map(b => { const v = acctBal(b.id); return `<div class="card" onclick="acctSheet('${b.id}')" style="cursor:pointer"><div class="lbl">${(S.banks || []).length ? esc(cardName(b)) : 'In the bank (debit)'}</div><div class="big ${v < 0 ? 'neg' : ''}">${fmt(v)}</div></div>`; }).join('');
const ACCT = new Proxy({}, { get: (_, a) => acctName(a) });
const okAcct = a => isBank(a) || isCard(a) ? a : 'cash';
const acct = t => t.acct || 'cash';
// A move shifts money between two accounts. Older moves only stored "from" (Cash ↔ Bank).
const moveTo = t => t.to || (t.from === 'cash' ? 'bank' : 'cash');
const moves = () => { const B = bankList(), n = b => acctName(b.id);
  return [...B.flatMap(b => [[`cash>${b.id}`, `Cash → ${n(b)} (deposit)`], [`${b.id}>cash`, `${n(b)} → Cash (withdrawal)`]]),
    ...B.flatMap(a => B.filter(b => b !== a).map(b => [`${a.id}>${b.id}`, `${n(a)} → ${n(b)} (transfer)`])),
    ...cardList().flatMap(c => [...B.map(b => [`${b.id}>${c.id}`, `Pay ${cardName(c)} from ${n(b)}`]), [`cash>${c.id}`, `Pay ${cardName(c)} with Cash`]])]; };
const moveName = t => isCard(moveTo(t)) ? `Paid ${acctName(moveTo(t))} from ${acctName(t.from)}` : `Moved ${acctName(t.from)} → ${acctName(moveTo(t))}`;
// For a credit card the balance is negative while you owe on it.
const acctBal = a => ((S.open || {})[a] || 0) + sum(S.tx, t => t.type === 'move' ? (t.from === a ? -t.amount : moveTo(t) === a ? t.amount : 0) : acct(t) !== a ? 0 : t.type === 'in' ? t.amount : -t.amount);
const cardUsed = id => S.tx.some(t => t.acct === id || t.to === id || t.from === id) || (S.rec || []).some(r => r.acct === id);
const cardsShown = () => cardList().filter(c => (S.cards || []).length || cardUsed(c.id));
const usesCredit = () => cardsShown().length > 0;
const owedOn = id => Math.max(-acctBal(id), 0);

  const it = t.itemId && t.qty > 0 && S.items.find(i => i.id === t.itemId);
  if (t.ret) {
    if (it && t.back && confirm(`This was a return. Take ${t.qty} × ${it.name} back out of stock?`)) it.qty -= t.qty;
    const owed = t.owedCut > 0 && S.debts.find(d => d.sale === t.ret); if (owed) owed.amount = round(owed.amount + t.owedCut);
  } else if (it && confirm(`Put ${t.qty} × ${it.name} back in stock?`)) it.qty += t.qty;
  dropPics([t]);
  S.tx = S.tx.filter(x => x.id !== id);
  const debt = t.sale && !S.tx.some(x => x.sale === t.sale) && S.debts.find(d => d.sale === t.sale);
  if (debt && confirm(`This sale left ${cur(Math.max(bal(debt), 0))} owing from ${debt.name}. Remove that from the Owing tab too?`)) S.debts = S.debts.filter(d => d !== debt);
  commit(); render();
}

  const list = S.tx.filter(t => sel.has(t.id)); if (!list.length) return;

  const sold = list.filter(t => !t.ret && t.itemId && t.qty > 0 && S.items.some(i => i.id === t.itemId));
  if (sold.length && confirm(`${sold.length} of these ${sold.length === 1 ? 'is a sale' : 'are sales'}. Put the sold items back in stock?`)) sold.forEach(t => { S.items.find(i => i.id === t.itemId).qty += t.qty; });
  dropPics(list);
  S.tx = S.tx.filter(t => !sel.has(t.id));
  const gone = S.debts.filter(d => d.sale && list.some(t => t.sale === d.sale) && !S.tx.some(t => t.sale === d.sale));
  if (gone.length && confirm(`${gone.length === 1 ? 'One of the deleted sales still has an amount' : gone.length + ' of the deleted sales still have amounts'} on the Owing tab. Remove ${gone.length === 1 ? 'it' : 'them'} from there too?`)) S.debts = S.debts.filter(d => !gone.includes(d));
  sel.clear(); selMode = false; commit(); render();
}

/* ---------- recording a sale (full, part or pay-later) ---------- */
// lines: [{it, qty, price}]. Returns {total, paid, owing}, or a message string if something is missing.
// Only money actually received counts as Money In now; anything owing becomes a "They owe me" debt.
function recordSale(lines, o) {
  const T0 = round(sum(lines, l => round(l.qty * l.price))), disc = Math.min(Math.max(round(o.disc || 0), 0), T0), T = round(T0 - disc);
  let dLeft = disc;
  const net = lines.map((l, i) => { const f = round(l.qty * l.price), d = disc > 0 ? (i === lines.length - 1 ? dLeft : Math.min(dLeft, round(disc * f / T0))) : 0; dLeft = round(dLeft - d); return { full: round(f - d), d }; });
  let P = o.pay === 'later' ? 0 : o.pay === 'part' ? round(parseFloat(o.paid) || 0) : T;
  if (o.pay === 'part' && !(P > 0)) return 'Enter how much was paid now, or choose Pay later.';
  if (P > T) P = T;
  const owing = round(T - P), cust = String(o.cust || '').trim();
  if (owing > 0 && !cust) return 'Add the customer name, so the amount owing goes under their name on the Owing tab.';
  const sale = uid(), date = o.date || today(); let left = P;
  lines.forEach((l, i) => {
    const full = net[i].full;
    const cash = owing > 0 ? (i === lines.length - 1 ? left : Math.min(left, round(P * full / T))) : full;
    left = round(left - cash);
    l.it.qty -= l.qty;
    const t = { id: uid(), type: 'in', amount: round(cash), cat: 'Sales', note: `Sold ${l.qty} × ${l.it.name}`, cust, acct: isBank(o.acct) ? o.acct : 'cash', gst: gstOf(full, o.gstInc), date, cogs: round(l.qty * (l.it.cost || 0)), itemId: l.it.id, qty: l.qty, sale, ...(staffMode && staff ? { by: staff.who } : {}) };
    if (owing > 0) t.saleAmt = full;
    if (net[i].d > 0) t.disc = net[i].d;
    S.tx.push(t);
  });
  if (owing > 0) S.debts.push({ id: uid(), dir: 'owed', name: cust, amount: owing, note: 'Sale: ' + lines.map(l => `${l.qty} × ${l.it.name}`).join(', '), date, payments: [], sale, ...(isDate(o.due) ? { due: o.due } : {}) });
  return { total: T, paid: P, owing, sale };
}
const saleMsg = (r, cust) => r.owing > 0 ? `✓ Sale recorded: ${cur(r.total)}. Paid now ${cur(r.paid)}; ${cur(r.owing)} owing was added to the Owing tab under ${cust}.` : `✓ Sale recorded: ${cur(r.total)}`;
const PAYOPTS = [['full', 'Paid in full'], ['part', 'Part payment now'], ['later', 'Pay later (on account)']];

/* ---------- Sell screen (point of sale) ---------- */
let cart = [], posCust = '', posAcct = 'cash', posGst = true, posMsg = '', posPay = 'full', posPaid = '', posDue = '', posDisc = '', lastSale = '';
function cartAdd(it, q) { const line = cart.find(c => c.id === it.id); if (line) line.qty += q; else cart.push({ id: it.id, qty: q, price: it.price }); posMsg = ''; lastSale = ''; }
const nextNum = () => Math.max(0, ...S.items.map(i => i.num || 0)) + 1;
const itemByNum = n => S.items.find(i => i.num === n);
function posPreview() {
  const v = $('#posNum').value, it = itemByNum(parseInt(v));

}

function posPrice(id) {
  const l = cart.find(c => c.id === id); if (!l) return;
  const v = prompt('Price each for this sale ($)', l.price); if (v === null) return;
  const n = parseFloat(v); if (Number.isFinite(n) && n >= 0) { l.price = round(n); render(); }
}
function posOwing() {
  const el = $('#posOwe'); if (!el) return;
  const T = cartTotals().T, P = Math.min(round(parseFloat(posPaid) || 0), T);
  el.textContent = posPay === 'later' ? `${cur(T)} will be added to Owing → Owed to me.` : posPay === 'part' ? `${cur(round(T - P))} will be added to Owing → Owed to me.` : '';
}
function posClear() { if (cart.length && confirm('Clear this sale?')) { cart = []; render(); } }
function posDone() {
  const lines = cart.map(c => ({ c, it: S.items.find(i => i.id === c.id) })).filter(x => x.it);
  if (!lines.length) return;
  const short = lines.filter(x => x.c.qty > x.it.qty);
  if (short.length && !confirm(`Not enough in stock for: ${short.map(x => `${x.it.name} (have ${x.it.qty})`).join(', ')}.\n\nRecord the sale anyway?`)) return;
  const cust = posCust.trim();
  const r = recordSale(lines.map(({ c, it }) => ({ it, qty: c.qty, price: c.price })), { cust, acct: posAcct, gstInc: posGst, pay: posPay, paid: posPaid, due: posDue, disc: cartTotals().disc });
  if (typeof r === 'string') { alert(r); return; }
  posMsg = saleMsg(r, cust); lastSale = r.sale; cart = []; posCust = ''; posPay = 'full'; posPaid = ''; posDue = ''; posDisc = '';
  commit(); render();
}

/* ---------- barcodes: make them (EAN-13 labels) and look products up by them ---------- */
const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
const EAN_P = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
const eanCheck = d12 => { let s = 0; for (let i = 0; i < 12; i++) s += (+d12[i]) * (i % 2 ? 3 : 1); return (10 - s % 10) % 10; };
// StockPile's own barcode for a product: "2" (the in-store range) + the item number + a check digit.
const itemEAN = n => { const b = '2' + String(n).padStart(11, '0'); return b + eanCheck(b); };
function eanBits(code) {
  const R = EAN_L.map(x => x.replace(/./g, c => c === '0' ? '1' : '0')), G = R.map(x => x.split('').reverse().join('')), p = EAN_P[+code[0]];
  let b = '101';
  for (let i = 0; i < 6; i++) b += (p[i] === 'L' ? EAN_L : G)[+code[i + 1]];
  b += '01010';
  for (let i = 7; i < 13; i++) b += R[+code[i]];
  return b + '101';
}
function eanSVG(code, h = 56) {
  const bits = eanBits(code), q = 11, w = bits.length + 2 * q; let rects = '', i = 0;
  while (i < bits.length) { if (bits[i] === '1') { let j = i; while (bits[j] === '1') j++; rects += `<rect x="${q + i}" y="2" width="${j - i}" height="${h}"/>`; i = j; } else i++; }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h + 16}" style="width:100%;max-width:230px;background:#fff"><rect width="${w}" height="${h + 16}" fill="#fff"/><g fill="#000">${rects}</g><text x="${w / 2}" y="${h + 13}" font-size="10" font-family="monospace" text-anchor="middle" fill="#000">${code}</text></svg>`;
}
const cleanCode = v => { v = String(v ?? '').trim().replace(/[^0-9A-Za-z\-]/g, '').slice(0, 40); return /^0\d{12}$/.test(v) ? v.slice(1) : v; };
function itemByCode(v) {
  v = cleanCode(v); if (!v) return undefined;
  const own = S.items.find(i => i.code && i.code === v); if (own) return own;
  return /^2\d{12}$/.test(v) && +v[12] === eanCheck(v.slice(0, 12)) ? itemByNum(parseInt(v.slice(1, 12), 10)) : undefined;
}
function printLabels() { if (staffMode) return;
  if (!S.items.length) return;
  const n = Math.min(Math.max(parseInt(prompt('How many labels for each product?', '1')) || 0, 0), 60); if (!n) return;
  const price = confirm('Show the price on each label?\n\nOK = show prices, Cancel = no prices');
  const items = [...S.items].sort((a, b) => a.num - b.num);
  printHTML(`<div class="labs">${items.map(i => Array(n).fill(`<div class="lab"><div class="ln">#${i.num} ${esc(i.name)}</div>${eanSVG(itemEAN(i.num))}${price ? `<div class="lp">${cur(i.price)}</div>` : ''}</div>`).join('')).join('')}</div>`);
}
function barcodeSheet(id) { if (staffMode) return;
  const it = S.items.find(i => i.id === id); if (!it) return;
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><h2>Barcode: ${esc(it.name)}</h2>
    <div style="text-align:center">${eanSVG(itemEAN(it.num), 70)}</div>

    <div class="row"><button class="btn" onclick="printHTML(document.querySelector('#oneLab').innerHTML)">Print this label</button></div>
    <div id="oneLab" hidden><div class="labs"><div class="lab"><div class="ln">#${it.num} ${esc(it.name)}</div>${eanSVG(itemEAN(it.num))}</div></div></div>
    <h3>Product already has a barcode?</h3>
    <p class="mute">${it.code ? `Its own barcode is saved (<b>${esc(it.code)}</b>). Scanning either barcode finds this product.` : "If the packaging already has a barcode, scan it once and StockPile will recognise it from then on. No label needed."}</p>
    <div class="row"><button class="btn sec" onclick="startScan('assign','${it.id}')">📷 Scan its own barcode</button>${it.code ? `<button class="btn sec" onclick="clearCode('${it.id}')">Forget it</button>` : ''}</div>
    <div class="row end" style="margin-top:14px"><button class="btn sec" onclick="closeForm()">Close</button></div></div>`;

/* ---------- camera scanner ---------- */
let scan = null;
function stopScan() { if (scan) { clearTimeout(scan.timer); try { scan.stream.getTracks().forEach(t => t.stop()); } catch (e) {} scan = null; } }
async function startScan(mode, target, cb) {
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert("This phone's browser can't scan barcodes from here. Use the item number instead."); return; }
  stopScan();
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><h2>${mode === 'sell' ? 'Scan to sell' : mode === 'link' ? 'Scan the other phone’s code' : 'Scan the barcode'}</h2>
    <video id="scanVid" playsinline muted style="width:100%;max-height:42vh;border-radius:12px;background:#000;object-fit:cover"></video>
    <div id="scanAsk" style="margin-top:10px"></div>
    <div id="scanMsg" class="note" style="margin-top:10px">Starting the camera…</div>
    <div class="row end"><button class="btn" onclick="closeForm()">Done</button></div></div>`;
  m.hidden = false; m.onclick = null;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const vid = $('#scanVid');
    if (!vid || $('#modal').hidden) { stream.getTracks().forEach(t => t.stop()); return; }
    vid.srcObject = stream; await vid.play();
    let formats = mode === 'link' ? ['qr_code'] : ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
    try { const sup = await BarcodeDetector.getSupportedFormats(); formats = formats.filter(f => sup.includes(f)); } catch (e) {}
    if (!formats.length) { stream.getTracks().forEach(t => t.stop()); $('#scanMsg').textContent = "This phone's browser can't read that kind of code."; return; }
    const det = new BarcodeDetector({ formats });
    scan = { stream, mode, target, cb, last: '', lastAt: 0, pending: null, timer: 0 };
    $('#scanMsg').textContent = mode === 'link' ? 'Point the camera at the code on the other phone.' : 'Point the camera at a barcode.';
    const tick = async () => {
      if (!scan) return;
      try { if (!scan.pending) { const r = await det.detect(vid); if (scan && r.length) onScan(r[0].rawValue); } } catch (e) {}
      if (scan) scan.timer = setTimeout(tick, 250);
    };
    tick();
  } catch (e) { const el = $('#scanMsg'); if (el) el.textContent = "Couldn't open the camera. Allow camera access for StockPile, then try again."; }
}
function onScan(v) {
  if (!scan || scan.pending) return;
  const now = Date.now(); if (v === scan.last && now - scan.lastAt < 2500) return;
  scan.last = v; scan.lastAt = now;
  const msg = $('#scanMsg');
  if (scan.mode === 'link') {
    if (!String(v).startsWith('SPL1:')) { msg.textContent = 'That is not a StockPile link code.'; return; }
    const cb = scan.cb; closeForm(); if (cb) cb(String(v)); return;
  }
  if (scan.mode === 'sell') {
    const it = itemByCode(v);
    if (!it) { msg.textContent = `No product has the barcode ${cleanCode(v) || 'that was scanned'}. Add it from the Stock tab → Barcode.`; return; }
    scan.pending = it.id;
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    $('#scanAsk').innerHTML = `<div class="card"><div class="t">#${it.num} ${esc(it.name)}</div><div class="mute">${cur(it.price)} each · ${it.qty} in stock</div>
      <div class="row" style="margin-top:8px;align-items:flex-end"><label class="pf"><span>How many</span><input id="scanQty" class="f" type="number" inputmode="numeric" min="1" value="1" onkeydown="if(event.key==='Enter'){event.preventDefault();scanAdd()}"></label>
      <button class="btn in" onclick="scanAdd()">Add</button><button class="btn sec" onclick="scanResume('')">Skip</button></div></div>`;
    msg.textContent = 'Enter how many, then tap Add.';
    const q = $('#scanQty'); if (q) { q.focus(); if (q.select) q.select(); }
  } else {
    const it = S.items.find(i => i.id === scan.target), code = cleanCode(v), other = itemByCode(v);
    if (!it || !code) return;
    if (other && other.id !== it.id) { msg.textContent = `That barcode already belongs to ${other.name}.`; return; }
    it.code = code; closeForm(); commit(); render(); alert(`Barcode saved for ${it.name}. Scanning it on the Sell screen will now find this product.`);
  }
}
function scanAdd() {
  if (!scan || !scan.pending) return;
  const it = S.items.find(i => i.id === scan.pending), q = Math.max(1, Math.round(parseFloat($('#scanQty').value)) || 1);
  if (it) cartAdd(it, q);
  scanResume(it ? `✓ Added ${q} × ${it.name}` : '');
}
function scanResume(m) {
  if (!scan) return;

/* ---------- receipts and voiding a sale ---------- */
function saleInfo(id) {
  const tx = S.tx.filter(t => t.sale === id); if (!id || !tx.length) return null;
  const debt = S.debts.find(d => d.sale === id);
  const lines = tx.map(t => { const it = t.itemId && S.items.find(i => i.id === t.itemId), amount = (t.saleAmt ?? t.amount) + (t.disc || 0), qty = t.qty > 0 ? t.qty : 1; return { name: it ? it.name : String(t.note || 'Item').replace(/^Sold \d+ × /, ''), qty, each: round(amount / qty), amount }; });
  const disc = round(sum(tx, t => t.disc)), total = round(sum(lines, l => l.amount) - disc), owing = debt ? Math.max(bal(debt), 0) : 0;
  const returns = S.tx.filter(t => t.ret === id), returned = round(sum(returns, t => -(t.saleAmt || 0)));
  return { id, tx, debt, lines, total, owing, disc, returns, returned, paid: round(total - returned - owing), gst: round(sum(tx, t => t.gst)), date: tx[0].date, by: tx[0].by || '', cust: tx[0].cust || (debt ? debt.name : ''), no: 'R-' + tx[0].date.replace(/-/g, '') + '-' + id.slice(-4).toUpperCase() };
}
function receiptBody(r) {
  return `<div class="rc"><div class="rch">${esc(profName())}</div><div class="rcs">Receipt ${esc(r.no)} · ${niceDate(r.date)}</div>
    ${r.cust ? `<div class="rcs">Customer: <b>${esc(r.cust)}</b></div>` : ''}${r.by ? `<div class="rcs">Served by ${esc(r.by)}</div>` : ''}
    <table><tr><th>Item</th><th>Qty</th><th>Each</th><th>Amount</th></tr>${r.lines.map(l => `<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${cur(l.each)}</td><td>${cur(l.amount)}</td></tr>`).join('')}</table>
    ${r.disc > 0 ? `<div class="rct"><span>Subtotal</span><span>${cur(r.total + r.disc)}</span></div><div class="rct"><span>Discount</span><span>−${cur(r.disc)}</span></div>` : ''}
    <div class="rct"><span>Total</span><b>${cur(r.total)}</b></div>
    ${r.returned > 0 ? `<div class="rct"><span>Returned</span><span>−${cur(r.returned)}</span></div>` : ''}
    <div class="rct"><span>Paid</span><span>${cur(r.paid)}</span></div>
    ${r.owing > 0 ? `<div class="rct"><span>Still owing${r.debt && r.debt.due ? ` (due ${niceDate(r.debt.due)})` : ''}</span><b>${cur(r.owing)}</b></div>` : '<div class="rct"><span>Paid in full</span><span>✓</span></div>'}
    ${S.set.gst && r.gst ? `<div class="rcs">Includes GST ${cur(r.gst)}</div>` : ''}</div>`;
}
function receiptText(r) {
  return [profName(), `Receipt ${r.no} · ${niceDate(r.date)}`, r.cust ? `Customer: ${r.cust}` : '', '', ...r.lines.map(l => `${l.qty} × ${l.name} @ ${cur(l.each)} = ${cur(l.amount)}`), '', r.disc > 0 ? `Discount: -${cur(r.disc)}` : '', `Total: ${cur(r.total)}`, r.returned > 0 ? `Returned: -${cur(r.returned)}` : '', `Paid: ${cur(r.paid)}`,
    r.owing > 0 ? `Still owing: ${cur(r.owing)}${r.debt && r.debt.due ? ` (due ${niceDate(r.debt.due)})` : ''}` : 'Paid in full', S.set.gst && r.gst ? `Includes GST ${cur(r.gst)}` : ''].filter((x, i, a) => x !== '' || (i > 0 && a[i - 1] !== '')).join('\n');
}
function receipt(id) {
  const r = saleInfo(id); if (!r) { alert("That sale isn't in your records any more."); return; }
  const m = $('#modal');
  m.innerHTML = `<div class="sheet">${receiptBody(r)}
    <div class="row" style="margin-top:14px"><button class="btn" onclick="printHTML(receiptBody(saleInfo('${id}')))">Print</button><button class="btn" onclick="shareText('Receipt',receiptText(saleInfo('${id}')))">Send</button>
      ${!can('refunds') ? '' : `<button class="btn sec" onclick="closeForm();returnForm('${id}')">Return items</button><button class="btn out" onclick="voidSale('${id}')">Void sale</button>`}<button class="btn sec" onclick="closeForm()">Close</button></div></div>`;
  m.hidden = false; m.onclick = e => { if (e.target === m) closeForm(); };

function voidSale(id) { if (!can('refunds')) return;
  const r = saleInfo(id); if (!r) return;
  const later = r.debt ? paid(r.debt) : 0;
  if (!confirm(`Void this whole sale (${cur(r.total)})?\n\nThe items go back into stock and the sale is removed from your records${r.debt ? ', along with the amount on the Owing tab' : ''}.` + (later > 0 ? `\n\nNote: ${cur(later)} in payments already recorded against it will stay in your Ledger. Delete those entries yourself if they should go too.` : ''))) return;
  r.tx.forEach(t => { const it = t.itemId && S.items.find(i => i.id === t.itemId), keep = (t.qty > 0 ? t.qty : 0) - sum(r.returns.filter(x => x.line === t.id), x => x.qty); if (it && keep > 0) it.qty += keep; });
  dropPics(r.tx.concat(r.returns));
  S.tx = S.tx.filter(t => t.sale !== id && t.ret !== id);
  if (r.debt) S.debts = S.debts.filter(d => d !== r.debt);
  if (lastSale === id) { lastSale = ''; posMsg = ''; }
  closeForm(); commit(); render();
}

/* ---------- customers ---------- */
let custCache = [];
const ckey = s => String(s || '').trim().toLowerCase();
function customerList() {
  const m = new Map();
  const get = n => { const k = ckey(n); if (!k) return null; if (!m.has(k)) m.set(k, { key: k, name: String(n).trim(), sales: 0, owing: 0, ids: new Set() }); return m.get(k); };
  S.tx.forEach(t => { if (!t.cust || t.cogs === undefined) return; const c = get(t.cust); if (!c) return; if (t.type === 'in') { c.sales += t.saleAmt ?? t.amount; c.ids.add(t.sale || t.id); } else if (t.ret) c.sales += t.saleAmt || 0; });
  S.debts.forEach(d => { if (d.dir === 'owed') { const c = get(d.name); if (c) c.owing += Math.max(bal(d), 0); } });
  (S.contacts || []).forEach(k => get(k.name));
  return [...m.values()].map(c => ({ ...c, sales: round(c.sales), owing: round(c.owing), count: c.ids.size })).sort((a, b) => b.owing - a.owing || b.sales - a.sales || a.name.localeCompare(b.name));
}

/* ---------- customer contacts and messages (sent from this phone's own texting and email apps) ---------- */
const EMAIL_OK = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const cleanPhone = p => String(p ?? '').replace(/[^0-9+]/g, '').slice(0, 20);
const contactOf = name => (S.contacts || []).find(c => c.key === ckey(name));
function contactForm(name, back) {

const smsLink = (phone, body) => 'sms:' + phone + '?body=' + encodeURIComponent(body);
const mailLink = (to, subject, body, bcc) => 'mailto:' + (to || '') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body) + (bcc && bcc.length ? '&bcc=' + bcc.join(',') : '');
// Ready-made wording. n = name, a = amount, d = due date (may be blank), B = business name.
const REMIND = [
  ['friendly', 'Friendly reminder', (n, a, d, B) => `Hi ${n}, just a friendly reminder from ${B} that ${a} ${d ? `was due on ${d}` : 'is still owing'}. If you've already sent it, thank you and please ignore this. Otherwise, let me know when works for you.`],
  ['firm', 'Firm follow-up', (n, a, d, B) => `Hi ${n}, this is ${B} following up on the ${a} ${d ? `that was due on ${d}` : 'still owing'}. Please send payment by ${niceDate(addDays(7))}, or get in touch so we can sort out a plan that works.`],
  ['final', 'Final notice', (n, a, d, B) => `Hi ${n}, this is a final reminder from ${B} that ${a} has been outstanding${d ? ` since ${d}` : ''}. Please pay by ${niceDate(addDays(7))} or contact me today. Until it's settled, I won't be able to offer further orders on account.`],
  ['plan', 'Offer a payment plan', (n, a, d, B) => `Hi ${n}, it's ${B}. I know things come up. If paying the full ${a} at once is hard right now, I'm happy to split it into smaller payments. Let me know what you can manage and we'll set it up.`]

const reminderText = (name, amount, due, kind = 'friendly') => (REMIND.find(r => r[0] === kind) || REMIND[0])[2](name, cur(amount), due ? niceDate(due) : '', profName());
const thanksText = (name, paidAmt, balance) => `Hi ${name}, got your payment of ${cur(paidAmt)}. Thank you! ${balance > 0 ? `Your balance with ${profName()} is now ${cur(balance)}.` : `You're all paid up with ${profName()}.`}`;
const remindDefault = due => due && daysSince(due) >= 14 ? 'firm' : 'friendly';
function tplPick(kind) { if (!pendMsg || !pendMsg.tpl) return; pendMsg.body = reminderText(pendMsg.c.name, pendMsg.tpl.amount, pendMsg.tpl.due, kind); $('#tplPrev').textContent = pendMsg.body; }
const promoText = msg => `${String(msg).trim()} - ${profName()}. Reply STOP to opt out.`;

function remind(debtId) { if (!can('owing')) return;

/* ---------- returns and refunds ---------- */
function returnForm(id) { if (!can('refunds')) return;
  const r = saleInfo(id); if (!r) return;
  const lines = r.tx.map(t => { const sold = t.qty > 0 ? t.qty : 1, it = t.itemId && S.items.find(i => i.id === t.itemId); return { t, it, sold, name: it ? it.name : String(t.note || 'Item').replace(/^Sold \d+ × /, ''), left: sold - sum(r.returns.filter(x => x.line === t.id), x => x.qty) }; }).filter(l => l.left > 0);
  if (!lines.length) { alert('Everything on this sale has already been returned.'); return; }
  form('Return items', [
    ...lines.map((l, i) => ({ k: 'q' + i, l: `${l.name}: how many came back? (up to ${l.left})`, t: 'number', v: '', ph: '0' })),
    { k: 'back', l: 'Put the returned items back in stock', t: 'check', v: true },
    acctField('cash', 'Refund paid from', 1)
  ], v => {
    const picks = lines.map((l, i) => ({ ...l, q: Math.min(Math.max(Math.round(v['q' + i]) || 0, 0), l.left) })).filter(l => l.q > 0);
    if (!picks.length) { alert('Enter how many of at least one item came back.'); return false; }
    let cutLeft = r.debt ? Math.max(bal(r.debt), 0) : 0, value = 0, cut = 0;
    for (const l of picks) {
      const full = l.t.saleAmt ?? l.t.amount, val = round(full * l.q / l.sold), c = Math.min(cutLeft, val);
      cutLeft = round(cutLeft - c); cut = round(cut + c); value = round(value + val);
      if (v.back && l.it) l.it.qty += l.q;
      S.tx.push({ id: uid(), type: 'out', amount: round(val - c), cat: 'Refund', note: `Returned ${l.q} × ${l.name}`, cust: r.cust, acct: v.acct, gst: -round((l.t.gst || 0) * l.q / l.sold), date: today(),
        cogs: -round((l.t.cogs || 0) * l.q / l.sold), saleAmt: -val, itemId: l.t.itemId, qty: l.q, ret: id, line: l.t.id, ...(v.back ? { back: true } : {}), ...(c > 0 ? { owedCut: c } : {}) });
    }
    if (cut > 0) r.debt.amount = round(r.debt.amount - cut);
    setTimeout(() => alert(`Return recorded: ${cur(value)}.` + (cut > 0 ? ` ${cur(cut)} came off what they owe.` : '') + (value - cut > 0 ? ` ${cur(round(value - cut))} refunded.` : '')), 80);
  }, `<div class="mute">The refund comes off what the customer still owes first. Anything beyond that is recorded as money paid back to them.</div>`);
}

/* ---------- stock adjustments (damaged, lost, personal use, recount) ---------- */
const ADJ_WHY = ['Damaged', 'Lost or stolen', 'Personal use', 'Given away', 'Counted wrong', 'Other'];
function adjustForm(id) { if (!can('stockEdit')) return;
  const it = S.items.find(i => i.id === id); if (!it) return;
  form('Adjust stock: ' + it.name, [
    { k: 'dir', l: 'What happened?', t: 'select', v: 'out', o: [['out', 'Take some out of stock'], ['in', 'Add some to stock (not a purchase)']] },
    { k: 'qty', l: 'How many', t: 'number', v: '', req: 1, pos: 1, ph: '0' },
    { k: 'why', l: 'Reason', t: 'select', v: ADJ_WHY[0], o: ADJ_WHY.map(x => [x, x]) },
    { k: 'note', l: 'Note (optional)', v: '' }
  ], v => {
    const q = Math.round(v.qty) * (v.dir === 'in' ? 1 : -1);
    it.qty += q;
    (S.adj = S.adj || []).push({ id: uid(), date: today(), itemId: it.id, name: it.name, qty: q, why: v.why, note: v.note, value: round(Math.abs(q) * (it.cost || 0)) });
  }, `<div class="mute">In stock now: ${it.qty}. Use this for stock that left or arrived without a sale or a purchase. It changes the count but not your money.</div>`);
}

/* ---------- recurring expenses (rent, phone, and so on) ---------- */
let recDay = '';
/* ---------- recurring bills and paydays: monthly, twice a month, every 2 weeks or weekly ---------- */

  more() {
    return `<h2>Backup &amp; settings</h2>

    ${storageCard()}
    <div class="card" style="margin-bottom:12px"><b>PIN lock</b>
      <p class="mute">${SEC ? 'PIN is ON 🔒. Your data and backups are encrypted. StockPile asks for the PIN when opened, and again after a minute away.' : LEGACY ? 'PIN is ON. StockPile asks for it when opened.' : 'Ask for a PIN before anything is shown' + (CAN ? ', and encrypt your data and backups with it.' : '.')}</p>

      ${SEC ? `<p class="mute">Recovery key: ${SEC.rec ? 'set ✓' : '<b>not set</b>. Without one, a forgotten PIN means everything is lost.'}</p>

        <p class="mute">Security questions: ${SEC.qa ? 'set ✓' : 'not set'}</p>
        <p class="row"><button class="btn sec" onclick="setQuestions()">${SEC.qa ? 'Change questions' : 'Set security questions'}</button>${SEC.qa ? '<button class="btn sec" onclick="removeQuestions()">Remove</button>' : ''}</p>
        ${isPersonal() ? '' : `<p class="mute">Staff: ${(S.staff || []).length ? S.staff.length + (S.staff.length === 1 ? ' person' : ' people') : 'none yet'}. Each person gets their own PIN that opens only this business.</p>

        : '<p class="mute">Fingerprint unlock is available in the installed app version.</p>') : ''}</div>
    ${isPersonal() ? `<div class="card" style="margin-bottom:12px"><b>Quick add icons</b>
      <p class="mute">Showing ${quickCats().length} of ${PCATS.length} category icons on Home.</p>
      <button class="btn" onclick="quickForm()">Choose icons</button></div>` : ''}
    ${isPersonal() ? `<div class="card" style="margin-bottom:12px"><b>Household</b>

    <div class="card" style="margin-bottom:12px"><b>Bank accounts & debit cards</b>

      ${(S.banks || []).length ? `<div class="list" style="margin-bottom:10px">${S.banks.map(c => `<div class="it"><div class="main" onclick="cardForm('${c.id}','bank')"><div class="t">${esc(cardName(c))}</div><div class="mute">Balance ${fmt(acctBal(c.id))}</div></div></div>`).join('')}</div>` : ''}
      <button class="btn" onclick="cardForm(null,'bank')">+ Add a bank account</button></div>
    <div class="card" style="margin-bottom:12px"><b>Credit cards</b>

      <button class="btn" onclick="cardForm()">+ Add a credit card</button></div>
    ${isPersonal() ? `<div class="card" style="margin-bottom:12px"><b>Bills & paydays</b>
      <p class="mute">Bills and paydays are on the Budget tab now, where you can tick each bill off as paid.</p>
      <button class="btn" onclick="tab='budget';render();window.scrollTo(0,0)">Open Bills</button></div>` : `<div class="card" style="margin-bottom:12px"><b>Recurring bills & paydays</b>
      <p class="mute">Bills and paycheques that repeat — monthly, twice a month, every 2 weeks or weekly — added to your Ledger automatically.</p>
      ${(S.rec || []).length ? `<div class="list" style="margin-bottom:10px">${[...S.rec].sort((a, b) => (a.type === 'in' ? 0 : 1) - (b.type === 'in' ? 0 : 1)).map(r => `<div class="it"><div class="main" onclick="recurForm('${r.id}')"><div class="t">${r.type === 'in' ? '💵 ' : ''}${esc(r.name)}</div><div class="mute">${recWhen(r)} · ${esc(acctName(r.acct))}</div></div><div class="amt ${r.type === 'in' ? 'pos' : ''}">${r.type === 'in' ? '+' : ''}${fmt(r.amount)}</div></div>`).join('')}</div>` : ''}
      <div class="row"><button class="btn sec" onclick="calendarExport()">📅 Add to my phone calendar</button></div>
      <div class="row" style="margin-top:8px"><button class="btn in" onclick="recurForm(null, { type: 'in', cat: '${isPersonal() ? 'Pay' : ''}', acct: '${bankList()[0].id}' })">+ Add payday</button><button class="btn" onclick="recurForm()">+ Add bill</button></div></div>`}
    ${isPersonal() ? `<div class="card" style="margin-bottom:12px"><b>Savings goals</b>
      <p class="mute">Save toward something — a trip, a car, an emergency fund. StockPile works out how much to put aside each payday.</p>
      ${(S.goals || []).length ? `<div class="list" style="margin-bottom:10px">${S.goals.map(g => `<div class="it"><div class="main" onclick="goalSheet('${g.id}')"><div class="t">🎯 ${esc(g.name)}</div><div class="mute">${fmt(goalSaved(g))} of ${fmt(g.target)}${g.date ? ' by ' + niceDate(g.date) : ''}</div></div></div>`).join('')}</div>` : ''}
      <button class="btn" onclick="goalForm()">+ Add a goal</button></div>` : ''}
    <div class="card" style="margin-bottom:12px"><b>Monthly report</b>
      <p class="mute">Where the money went in a month, compared to your budgets and the month before. Print or share it.</p>
      <div class="row"><button class="btn" onclick="reportSheet(monthShift(thisMonth(), -1))">Last month</button><button class="btn sec" onclick="reportSheet(thisMonth())">This month so far</button></div></div>
    <div class="card" style="margin-bottom:12px"><b>Year summary</b>
      <p class="mute">${isPersonal() ? 'Money in and out for a year, by category, to print or download.' : 'Income, expenses and profit for a year, to print or download at tax time.'}</p>
      <button class="btn" onclick="yearSheet()">Open year summary</button></div>
    <div class="card" style="margin-bottom:12px"><b>Graphs</b>
      ${isPersonal() ? `<div class="row between" style="margin-top:10px"><span>Budget donut on Home</span><select class="f" style="width:auto" onchange="setChart('spend',this.value)"><option value="donut" ${chartSet().spend === 'donut' ? 'selected' : ''}>On</option><option value="list" ${chartSet().spend === 'list' ? 'selected' : ''}>Off (list only)</option></select></div>` : ''}
      <div class="row between" style="margin-top:10px"><span>Last 6 months</span><select class="f" style="width:auto" onchange="setChart('trend',this.value)">${[['columns', 'Columns'], ['line', 'Line'], ['off', 'Off']].map(([v, l]) => `<option value="${v}" ${chartSet().trend === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      ${isPersonal() ? `<label class="chk"><input type="checkbox" ${chartSet().pace ? 'checked' : ''} onchange="setChart('pace',this.checked)"> Show the pace graph on the Budget tab</label>` : ''}
      <p class="mute">Graphs stay hidden until you tap Show.</p></div>
    <div class="card" style="margin-bottom:12px"><b>Appearance</b>
      <label class="chk"><input type="checkbox" ${isDark() ? 'checked' : ''} onchange="P.dark=this.checked;save();render()"> Dark mode</label></div>
    <div class="card" style="margin-bottom:12px"><b>Share with another phone</b>
      ${S.share ? `<p class="mute">“${esc(profName())}” is shared ✓${myName() ? ' · you are “' + esc(myName()) + '”' : ''}. Last sent or merged: ${S.lastSync ? niceDate(S.lastSync) : 'never'}.</p>
        <div class="row"><button class="btn" onclick="sendShare()">📤 Send update</button><button class="btn" onclick="pickShare('merge')">📥 Merge an update</button><button class="btn sec" onclick="stopShare()">Stop sharing</button></div>
        <p><button class="btn ${link && link.open ? 'in' : 'sec'}" onclick="linkSheet()">${link && link.open ? '🔗 Linked now' : '🔗 Live link (same Wi-Fi)'}</button></p>
        <p class="mute">Send your update to the other phone, and merge theirs when it arrives. Entries from both phones are combined, and stock counts add up from both. Receipt photos stay on the phone that took them.</p>`
      : `<p class="mute">Keep the same books on two phones, for a household budget or a second till. No internet or account needed: you pass a locked file between the phones and the app merges it.</p>
        <div class="row"><button class="btn" onclick="startShare()">Share “${esc(profName())}”</button><button class="btn sec" onclick="pickShare('join')">Join shared books</button></div>`}</div>
    ${isPersonal() ? `<div class="card" style="margin-bottom:12px"><b>Budgets</b>
      <p class="mute">Monthly limits for your spending categories. Progress shows on Home.</p>
      <button class="btn" onclick="budgetsForm()">Set budgets</button></div>` : ''}
    <div class="card" style="margin-bottom:12px" ${isPersonal() ? 'hidden' : ''}><b>GST</b>
      <label class="chk"><input type="checkbox" ${S.set.gst ? 'checked' : ''} onchange="S.set.gst=this.checked;save();render()"> Track GST</label>
      ${S.set.gst ? `<div class="row"><span class="mute">Rate %</span><input class="f" type="number" step="0.1" min="0" style="width:90px" value="${S.set.gstRate}" onchange="S.set.gstRate=parseFloat(this.value)||5;save()"></div>
      <p class="mute">Entries get an “Amount includes GST” tick box. Totals show under Ledger → Breakdown.</p>` : '<p class="mute">Off. Turn it on if you ever need it.</p>'}</div>
    <div class="card" style="margin-bottom:12px"><b>Open in Excel</b>

      <div class="row"><button class="btn sec" onclick="exportMoney()">Ledger (.csv)</button>${isPersonal() ? '' : '<button class="btn sec" onclick="exportStock()">Stock list (.csv)</button>'}</div></div>
    <div class="card"><b>Start over</b><p class="mute">Erases everything in the tracker.</p><button class="btn out" onclick="wipe()">Erase all data</button></div>
    <p class="mute" style="text-align:center;margin-top:18px">StockPile version ${VERSION}</p>`;
  }
};
function render() {
  if (recDay !== today()) { recDay = today(); if (applyRecurring()) save(); }
  const pers = isPersonal(); if (pers && (tab === 'sell' || tab === 'stock' || tab === 'money')) tab = 'home'; if (!pers && tab === 'budget') tab = 'home';
  if (staffMode && !staffTabs().includes(tab)) tab = 'sell';
  document.body.classList.toggle('dark', isDark()); document.body.classList.toggle('staff', staffMode);
  document.querySelectorAll('#nav button').forEach(b => { const t = b.dataset.t; b.hidden = staffMode ? !staffTabs().includes(t) : pers ? (t === 'sell' || t === 'stock' || t === 'money') : (t === 'receipts' || t === 'budget'); b.classList.toggle('on', t === tab); });
  $('#hdr').innerHTML = `<span>📦 StockPile${BETA ? ' <span class="beta">TEST COPY</span>' : ''}${link && link.open ? ' 🔗' : ''}</span>` + (staffMode ? `<button onclick="lockNow()">🔒 ${esc(staff ? staff.who : 'Staff')} · Lock</button>` : `<select id="profSel" aria-label="Switch books" onchange="switchProfile(this.value)">${P.list.map(p => `<option value="${p.id}" ${p.id === P.current ? 'selected' : ''}>${isPriv(p.id) ? '🔒 ' : ''}${p.share ? '⇄ ' : ''}${esc(p.name)}${p.kind === 'personal' ? ' (personal)' : ''}</option>`).join('')}</select>`);
  document.body.classList.toggle('setup', firstRun);
  $('#view').innerHTML = firstRun ? setupCard() : needKey() ? privCard() : V[tab]();
  loadThumbs();
}
async function init() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (e) { storageOK = false; }
  if (raw && raw.sec && raw.body) { SEC = raw.sec; render(); showLock(); return; }
  if (raw && typeof raw === 'object') {
    P = Object.assign(defaultP(), { list: raw.list, current: raw.current, dark: okDark(raw.dark), biz: raw.biz !== false });
    if (typeof raw.pin === 'string' && /^[a-z0-9]{1,16}$/.test(raw.pin)) LEGACY = raw.pin;
  }
  if (!raw) { let any = false; try { any = !!localStorage.getItem(KEY0); } catch (e) {} firstRun = !any; }
  sanitizeP(); await loadProfile(); render();
  if (LEGACY) showLock();
}
const ready = init();
if (!BETA && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
