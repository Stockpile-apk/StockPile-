<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#1d2433">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>StockPile</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e5e7eb;--green:#15803d;--red:#b91c1c;--accent:#0f766e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--ink);color:#fff;padding:10px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header button{background:none;border:1px solid #6b7280;color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:14px 2px;border:0;background:none;font-size:15px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:700}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:16px;margin:22px 0 8px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.lbl{font-size:13px;color:var(--mute)}
.big{font-size:23px;font-weight:700;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}.mute{color:var(--mute);font-size:14px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.in{background:var(--green)}.btn.out{background:var(--red)}
.btn.sec{background:#e5e7eb;color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.end{justify-content:flex-end}.between{justify-content:space-between}
.bar{margin:14px 0}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .main{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600;overflow-wrap:anywhere}
.amt{font-weight:700;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.prod{margin-bottom:10px}
.prod .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qty{font-size:28px;font-weight:800;text-align:right;line-height:1}
.low{background:#fef2f2;border-color:#fecaca}
.empty{padding:22px 0;text-align:center;color:var(--mute)}
select.f,input.f{padding:8px;border-radius:8px;border:1px solid var(--line);font-size:15px;background:#fff}
.br{padding:9px 0}.track{height:8px;background:#eef0f3;border-radius:6px;margin-top:5px;overflow:hidden}.fill{height:100%;border-radius:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal[hidden],#lock[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:16px}}
.fl{display:block;margin:12px 0}
.fl span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.fl input,.fl select{width:100%;padding:12px;font-size:17px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.fl input.bad{border-color:var(--red);background:#fef2f2}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
#lock{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock input{font-size:24px;text-align:center;letter-spacing:4px;padding:12px;border-radius:12px;border:0;width:200px;margin:18px 0 12px}
#lock a{color:#9ca3af;font-size:14px;margin-top:22px}
</style>
</head>
<body>
<header id="hdr"></header>
<nav id="nav">
  <button data-t="home">Home</button>
  <button data-t="money">Money</button>
  <button data-t="stock">Stock</button>
  <button data-t="debts">Debts</button>
  <button data-t="more">More</button>
</nav>
<main id="view"></main>
<div id="modal" hidden></div>
<div id="lock" hidden>
  <div style="font-size:48px">📦</div>
  <div style="font-size:20px;font-weight:700;margin-top:6px">StockPile</div>
  <input id="pinIn" type="password" autocomplete="off" placeholder="PIN">
  <div class="row" style="justify-content:center"><button class="btn" id="pinGo">Unlock</button><button class="btn sec" id="bioGo" hidden>👆 Fingerprint</button></div>
  <div id="pinMsg" style="color:#fca5a5;height:20px;margin-top:10px;font-size:14px"></div>
  <a href="#" id="pinForgot">Forgot PIN?</a>
</div>
<input type="file" id="restoreFile" accept=".json,.txt,application/json,text/plain" hidden>

<script>
const KEY0 = 'money_inventory_tracker_v1', PKEY = 'stockpile_profiles';
const fresh = () => ({ tx: [], items: [], debts: [], lastBackup: null, dirty: 0, auto: true, set: { gst: false, gstRate: 5 } });
const defaultP = () => ({ list: [{ id: 'default', name: 'My business' }], current: 'default' });
const CAN = !!(globalThis.crypto && crypto.subtle);
let S = fresh(), P = defaultP(), storageOK = true, loadFailed = false;
// DK: data key held in memory only while unlocked. SEC: encryption header (salt + wrapped key). LEGACY: old-style PIN hash.
let DK = null, SEC = null, LEGACY = null, saveQ = Promise.resolve();
const keyFor = id => id === 'default' ? KEY0 : KEY0 + '_' + id;
const profName = () => (P.list.find(p => p.id === P.current) || {}).name || 'My business';
const fileBase = () => 'stockpile-' + (profName().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'business') + '-backup';
async function loadProfile() {
  S = fresh(); loadFailed = false;
  try {
    const r = localStorage.getItem(keyFor(P.current));
    if (r) { let o = JSON.parse(r); if (o && o.enc) o = JSON.parse(await dec(DK, o)); S = clean(o); }
  } catch (e) { loadFailed = true; }
  if (S.set.pin && !SEC && !LEGACY) LEGACY = S.set.pin;
  delete S.set.pin;
}
function save() {
  if (loadFailed) return;
  const pid = P.current, sText = JSON.stringify(S), pBody = { list: P.list, current: P.current };
  if (!SEC) {
    try { localStorage.setItem(keyFor(pid), sText); localStorage.setItem(PKEY, JSON.stringify({ ...pBody, pin: LEGACY })); } catch (e) { storageOK = false; }
    return;
  }
  if (!DK) return;
  const key = DK, sec = SEC;
  saveQ = saveQ.then(async () => {
    const a = await enc(key, sText), b = await enc(key, JSON.stringify(pBody));
    localStorage.setItem(keyFor(pid), JSON.stringify({ enc: 1, ...a }));
    localStorage.setItem(PKEY, JSON.stringify({ sec, body: b }));
  }).catch(() => { storageOK = false; });
}

let tab = 'home', moneyFilter = 'month', moneyView = 'list', showNums = false, hiddenAt = 0;
const money = new Intl.NumberFormat('en-CA', { style: 'currency', currency: 'CAD' });
const cur = n => money.format(n || 0);
const fmt = n => showNums ? cur(n) : '$ •••';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const thisMonth = () => today().slice(0, 7);
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const round = n => Math.round(n * 100) / 100;
const niceDate = d => { try { return new Date(d + 'T12:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return d; } };
const ACCT = { cash: 'Cash', bank: 'Bank' };
const acct = t => t.acct || 'cash';
const acctBal = a => sum(S.tx, t => t.type === 'move' ? (t.from === a ? -t.amount : t.amount) : acct(t) !== a ? 0 : t.type === 'in' ? t.amount : -t.amount);
const gstOf = (amount, inc) => S.set.gst && inc ? round(amount * S.set.gstRate / (100 + S.set.gstRate)) : 0;
const eye = () => `<button class="btn sec sm" onclick="showNums=!showNums;render()">${showNums ? '🙈 Hide amounts' : '👁 Show amounts'}</button>`;

/* ---------- safety: only accept well-formed data (from storage or a backup file) ---------- */
const num = v => { v = parseFloat(v); return Number.isFinite(v) ? v : 0; };
const str = v => v == null ? '' : String(v).slice(0, 300);
const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
const okDate = v => isDate(v) ? v : today();
const okId = v => typeof v === 'string' && /^[a-z0-9]{1,24}$/i.test(v) ? v : uid();
const arr = v => Array.isArray(v) ? v.filter(x => x && typeof x === 'object') : [];
function clean(d) {
  const o = fresh(); d = d && typeof d === 'object' ? d : {};
  o.tx = arr(d.tx).filter(t => ['in', 'out', 'move'].includes(t.type)).map(t => {
    const r = { id: okId(t.id), type: t.type, amount: num(t.amount), note: str(t.note), date: okDate(t.date) };
    if (t.type === 'move') r.from = t.from === 'bank' ? 'bank' : 'cash';
    else {
      r.cat = str(t.cat); r.acct = t.acct === 'bank' ? 'bank' : 'cash'; r.gst = num(t.gst);
      if (t.cust) r.cust = str(t.cust);
      if (t.cogs !== undefined) r.cogs = num(t.cogs);
      if (t.itemId) r.itemId = okId(t.itemId);
    }
    return r;
  });
  o.items = arr(d.items).map(i => ({ id: okId(i.id), name: str(i.name), cost: num(i.cost), price: num(i.price), qty: Math.round(num(i.qty)), low: Math.round(num(i.low)) }));
  o.debts = arr(d.debts).map(x => ({ id: okId(x.id), name: str(x.name), dir: x.dir === 'owed' ? 'owed' : 'owe', amount: num(x.amount), note: str(x.note), date: okDate(x.date),
    payments: arr(x.payments).map(p => ({ amount: num(p.amount), date: okDate(p.date) })) }));
  o.lastBackup = isDate(d.lastBackup) ? d.lastBackup : null;
  o.dirty = Math.max(0, Math.round(num(d.dirty))); o.auto = d.auto !== false;
  const st = d.set && typeof d.set === 'object' ? d.set : {};
  o.set = { gst: !!st.gst, gstRate: num(st.gstRate) || 5 };
  if (typeof st.pin === 'string' && /^[a-z0-9]{1,16}$/.test(st.pin)) o.set.pin = st.pin;
  return o;
}
function sanitizeP() {
  P.list = arr(P.list).filter(p => typeof p.id === 'string' && /^[a-z0-9]{1,24}$/i.test(p.id)).map(p => ({ id: p.id, name: str(p.name) || 'My business' }));
  if (!P.list.length) P.list = defaultP().list;
  if (!P.list.some(p => p.id === P.current)) P.current = P.list[0].id;
}

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo(0, 0); });

/* ---------- generic form popup ---------- */
function form(title, fields, onSave, extra = '') {
  fields = fields.filter(Boolean);
  const m = $('#modal');
  m.innerHTML = `<div class="sheet"><h2>${esc(title)}</h2>${extra}${fields.map(fieldHTML).join('')}
    <div class="row end" style="margin-top:16px"><button class="btn sec" id="fCancel">Cancel</button><button class="btn" id="fSave">Save</button></div></div>`;
  m.hidden = false;
  const first = m.querySelector('input:not([type=checkbox]),select'); if (first && fields[0].t !== 'select') setTimeout(() => first.focus(), 50);
  $('#fCancel').onclick = closeForm;
  m.onclick = e => { if (e.target === m) closeForm(); };
  $('#fSave').onclick = () => {
    const v = {};
    for (const f of fields) {
      const el = document.getElementById('f_' + f.k);
      if (f.t === 'check') { v[f.k] = el.checked; continue; }
      let val = el.value.trim();
      if (f.t === 'money' || f.t === 'number') { val = val === '' ? NaN : parseFloat(val); }
      const bad = f.req && (val === '' || Number.isNaN(val) || ((f.t === 'money' || f.t === 'number') && f.pos && val <= 0));
      if (bad) { el.classList.add('bad'); el.focus(); return; }
      if (Number.isNaN(val)) val = 0;
      v[f.k] = val;
    }
    if (onSave(v) !== false) { closeForm(); commit(); render(); }
  };
}
function closeForm() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }
function fieldHTML(f) {
  const id = 'f_' + f.k, val = f.v ?? '';
  if (f.t === 'check') return `<label class="chk"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${esc(f.l)}</label>`;
  if (f.t === 'select') return `<label class="fl"><span>${esc(f.l)}</span><select id="${id}">${f.o.map(o => `<option value="${esc(o[0])}" ${o[0] === val ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  let attrs = 'type="text"';
  if (f.t === 'money') attrs = 'type="number" step="0.01" min="0" inputmode="decimal"';
  if (f.t === 'number') attrs = 'type="number" step="1" inputmode="numeric"';
  if (f.t === 'date') attrs = 'type="date"';
  if (f.t === 'pin') attrs = 'type="password" autocomplete="off"';
  let list = '';
  if (f.list) { list = `<datalist id="dl_${f.k}">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`; attrs += ` list="dl_${f.k}"`; }
  return `<label class="fl"><span>${esc(f.l)}</span><input id="${id}" ${attrs} value="${esc(val)}" placeholder="${esc(f.ph || '')}">${list}</label>`;
}
const acctField = (v, l) => ({ k: 'acct', l: l || 'Cash or bank?', t: 'select', v: v || 'cash', o: [['cash', 'Cash'], ['bank', 'Bank']] });
const gstField = def => S.set.gst ? { k: 'gstInc', l: `Amount includes GST (${S.set.gstRate}%)`, t: 'check', v: def } : null;
function categories(type) {
  const base = type === 'in' ? ['Sales', 'Job payment', 'Other income'] : ['Inventory', 'Supplies', 'Gas', 'Tools', 'Rent', 'Phone', 'Food', 'Other'];
  const used = S.tx.filter(t => t.type === type).map(t => t.cat).filter(Boolean);
  return [...new Set([...used, ...base])];
}
const customers = () => [...new Set(S.tx.map(t => t.cust).filter(Boolean))];

/* ---------- money ---------- */
function addTx(type, t) {
  const isEdit = !!t, isIn = type === 'in';
  t = t || { date: today(), type, amount: '', cat: '', note: '', cust: '', acct: 'cash' };
  form((isEdit ? 'Edit ' : '') + (isIn ? 'Money In' : 'Money Out'), [
    { k: 'amount', l: 'Amount ($)', t: 'money', v: t.amount, req: 1, pos: 1, ph: '0.00' },
    { k: 'cat', l: 'Category', v: t.cat, list: categories(type), ph: isIn ? 'e.g. Sales' : 'e.g. Supplies' },
    isIn ? { k: 'cust', l: 'Customer (optional)', v: t.cust, list: customers() } : null,
    { k: 'note', l: 'Note (optional)', v: t.note, ph: 'What was it for?' },
    acctField(acct(t)),
    gstField(isEdit ? !!t.gst : false),
    { k: 'date', l: 'Date', t: 'date', v: t.date }
  ], v => {
    const data = { amount: round(v.amount), cat: v.cat, note: v.note, acct: v.acct, date: v.date || today(), gst: gstOf(round(v.amount), v.gstInc) };
    if (isIn) data.cust = v.cust;
    if (isEdit) Object.assign(t, data); else S.tx.push({ id: uid(), type, ...data });
  });
}
function addMove(t) {
  const isEdit = !!t;
  t = t || { date: today(), amount: '', from: 'cash', note: '' };
  form(isEdit ? 'Edit move' : 'Move money', [
    { k: 'from', l: 'Which way?', t: 'select', v: t.from, o: [['cash', 'Cash → Bank (deposit)'], ['bank', 'Bank → Cash (withdrawal)']] },
    { k: 'amount', l: 'Amount ($)', t: 'money', v: t.amount, req: 1, pos: 1, ph: '0.00' },
    { k: 'note', l: 'Note (optional)', v: t.note },
    { k: 'date', l: 'Date', t: 'date', v: t.date }
  ], v => {
    const data = { from: v.from, amount: round(v.amount), note: v.note, date: v.date || today() };
    if (isEdit) Object.assign(t, data); else S.tx.push({ id: uid(), type: 'move', ...data });
  }, '<div class="mute">For deposits and withdrawals. It shifts money between Cash and Bank without counting as income or spending.</div>');
}
function editTx(id) { const t = S.tx.find(x => x.id === id); if (t) t.type === 'move' ? addMove(t) : addTx(t.type, t); }
function delTx(id) { if (confirm('Delete this entry?')) { S.tx = S.tx.filter(x => x.id !== id); commit(); render(); } }

/* ---------- inventory ---------- */
function editItem(id) {
  const it = S.items.find(x => x.id === id) || { name: '', cost: '', price: '', qty: '', low: '' };
  form(id ? 'Edit product' : 'Add product', [
    { k: 'name', l: 'Product name', v: it.name, req: 1 },
    { k: 'cost', l: 'What it costs you (each)', t: 'money', v: it.cost, ph: '0.00' },
    { k: 'price', l: 'What you sell it for (each)', t: 'money', v: it.price, ph: '0.00' },
    { k: 'qty', l: id ? 'How many you have now' : 'How many you have now (starting count)', t: 'number', v: it.qty, ph: '0' },
    { k: 'low', l: 'Warn me when stock gets down to (optional)', t: 'number', v: it.low, ph: 'e.g. 5' }
  ], v => {
    const data = { name: v.name, cost: round(v.cost), price: round(v.price), qty: Math.round(v.qty), low: Math.round(v.low) };
    if (id) Object.assign(it, data); else S.items.push({ id: uid(), ...data });
  });
}
function delItem(id) {
  const it = S.items.find(x => x.id === id);
  if (it && confirm(`Delete "${it.name}" from your stock list?\n(Money entries already recorded stay.)`)) { S.items = S.items.filter(x => x.id !== id); commit(); render(); }
}
function sell(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  form('Record a sale: ' + it.name, [
    { k: 'qty', l: 'How many sold', t: 'number', v: 1, req: 1, pos: 1 },
    { k: 'price', l: 'Price each ($)', t: 'money', v: it.price, req: 1 },
    { k: 'cust', l: 'Customer (optional)', v: '', list: customers() },
    acctField('cash', 'Paid by'),
    gstField(true),
    { k: 'date', l: 'Date', t: 'date', v: today() }
  ], v => {
    const q = Math.round(v.qty), amount = round(q * v.price);
    if (q > it.qty && !confirm(`You only have ${it.qty} in stock. Record the sale anyway?`)) return false;
    it.qty -= q;
    S.tx.push({ id: uid(), type: 'in', amount, cat: 'Sales', note: `Sold ${q} × ${it.name}`, cust: v.cust, acct: v.acct, gst: gstOf(amount, v.gstInc), date: v.date || today(), cogs: round(q * (it.cost || 0)), itemId: it.id });
  }, `<div class="mute">In stock: ${it.qty}. This adds the money to “Money In” and takes them off your stock count.</div>`);
}
function restock(id) {
  const it = S.items.find(x => x.id === id); if (!it) return;
  form('Restock: ' + it.name, [
    { k: 'qty', l: 'How many you got', t: 'number', v: '', req: 1, pos: 1, ph: '0' },
    { k: 'cost', l: 'Cost each ($)', t: 'money', v: it.cost },
    { k: 'rec', l: 'Also record this as Money Out', t: 'check', v: true },
    acctField('cash', 'Paid from'),
    gstField(false),
    { k: 'date', l: 'Date', t: 'date', v: today() }
  ], v => {
    const q = Math.round(v.qty), amount = round(q * v.cost);
    it.qty += q;
    if (v.cost) it.cost = round(v.cost);
    if (v.rec && v.cost) S.tx.push({ id: uid(), type: 'out', amount, cat: 'Inventory', note: `Restocked ${q} × ${it.name}`, acct: v.acct, gst: gstOf(amount, v.gstInc), date: v.date || today() });
  });
}

/* ---------- debts ---------- */
const paid = d => sum(d.payments || [], p => p.amount);
const bal = d => round(d.amount - paid(d));
function editDebt(id) {
  const d = S.debts.find(x => x.id === id) || { name: '', dir: 'owe', amount: '', note: '', date: today() };
  form(id ? 'Edit debt' : 'Add a debt', [
    { k: 'dir', l: 'Which way?', t: 'select', v: d.dir, o: [['owe', 'I owe them'], ['owed', 'They owe me']] },
    { k: 'name', l: 'Who', v: d.name, req: 1, ph: 'Person or company' },
    { k: 'amount', l: 'Total amount ($)', t: 'money', v: d.amount, req: 1, pos: 1, ph: '0.00' },
    { k: 'note', l: 'Note (optional)', v: d.note, ph: 'What it was for' },
    { k: 'date', l: 'Date', t: 'date', v: d.date }
  ], v => {

function hashPin(p) { let h = 5381; const s = 'stockpile:' + p; for (let r = 0; r < 500; r++) for (let i = 0; i < s.length; i++) h = (((h << 5) + h) ^ s.charCodeAt(i) ^ r) >>> 0; return h.toString(36); }

async function pinKey(pin, salt, iter) {

async function dec(key, o) { return td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(o.iv) }, key, unb64(o.ct))); }

// Turn encryption on. The header is written first, so a failure part-way leaves data readable.

  const body = await enc(key, JSON.stringify({ list: P.list, current: P.current }));
  localStorage.setItem(PKEY, JSON.stringify({ sec, body }));
  SEC = sec; DK = key; LEGACY = null;
  for (const p of P.list) {
    const r = localStorage.getItem(keyFor(p.id)); if (!r) continue;
    let o; try { o = JSON.parse(r); } catch (e) { continue; }
    if (o && !o.enc) localStorage.setItem(keyFor(p.id), JSON.stringify({ enc: 1, ...await enc(key, r) }));

}

async function removeEnc(pin) {

    const r = localStorage.getItem(keyFor(p.id)); if (!r) continue;
    let o; try { o = JSON.parse(r); } catch (e) { continue; }

}

async function prfSecret(id, salt) {

  if (!r.prf || !r.prf.results || !r.prf.results.first) throw fail("This phone's fingerprint can't be used to unlock StockPile. Your PIN still works.");

      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
      timeout: 60000, extensions: { prf: {} } } });

/* ---------- backup / export ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));

async function backupText(plain) {

}
async function backup(auto, plain) {

  S.lastBackup = today(); S.dirty = 0; save();

}

    if (navigator.canShare && navigator.canShare({ files: [f] })) {

    }
  } catch (e) { if (e && e.name === 'AbortError') return; }

  alert("This browser won't share straight from here, so the backup was saved to Downloads instead.\n\nTo send it: open My Files → Downloads, press and hold the newest stockpile backup file, then tap Share.");
}
async function openBackup(d, pin) {

      <div class="card"><div class="lbl">Total money</div><div class="big ${cash + bank < 0 ? 'neg' : ''}">${fmt(cash + bank)}</div></div>
      <div class="card"><div class="lbl">In – ${mn}</div><div class="big pos">${fmt(mIn)}</div></div>
      <div class="card"><div class="lbl">Out – ${mn}</div><div class="big neg">${fmt(mOut)}</div></div>
      <div class="card"><div class="lbl">Left over – ${mn}</div><div class="big ${mIn - mOut < 0 ? 'neg' : 'pos'}">${fmt(mIn - mOut)}</div></div>
      <div class="card"><div class="lbl">Profit on sales – ${mn}</div><div class="big">${fmt(saleProfit)}</div><div class="mute">sale price minus your cost</div></div>
      <div class="card"><div class="lbl">Stock value (at your cost)</div><div class="big">${fmt(stockVal)}</div></div>
      <div class="card"><div class="lbl">I owe</div><div class="big ${iOwe ? 'neg' : ''}">${fmt(iOwe)}</div></div>
      <div class="card"><div class="lbl">Owed to me</div><div class="big ${owedMe ? 'pos' : ''}">${fmt(owedMe)}</div></div>
    </div>
    ${low.length ? `<h3>⚠️ Running low – time to restock</h3><div class="list">${low.map(i => `<div class="it"><div class="main" onclick="tab='stock';render()"><div class="t">${esc(i.name)}</div></div><div class="amt neg">${i.qty} left</div></div>`).join('')}</div>` : ''}
    <h3>Latest entries</h3>
    <div class="list">${S.tx.length ? [...S.tx].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6).map(txRow).join('') : '<div class="empty">Nothing yet. Tap “+ Money In” or “− Money Out” to start.</div>'}</div>`;
  },
  money() {
    const months = [...new Set(S.tx.map(t => t.date.slice(0, 7)))].sort().reverse();
    let list = [...S.tx];
    if (moneyFilter === 'month') list = list.filter(t => t.date.startsWith(thisMonth()));
    else if (moneyFilter !== 'all') list = list.filter(t => t.date.startsWith(moneyFilter));
    list.sort((a, b) => b.date.localeCompare(a.date));
    const ins = list.filter(t => t.type === 'in'), outs = list.filter(t => t.type === 'out');
    const i = sum(ins, t => t.amount), o = sum(outs, t => t.amount);
    const label = ym => new Date(ym + '-15').toLocaleDateString('en-CA', { month: 'long', year: 'numeric' });
    let body;
    if (moneyView === 'list') body = `<div class="list">${list.length ? list.map(txRow).join('') : '<div class="empty">No entries for this period.</div>'}</div><p class="mute">Tip: tap an entry to change it.</p>`;
    else {
      const gc = sum(ins, t => t.gst), gp = sum(outs, t => t.gst);
      body = `<h3>Where the money went</h3><div class="card">${bars(groupBy(outs, t => t.cat), 'var(--red)')}</div>
      <h3>Where it came from</h3><div class="card">${bars(groupBy(ins, t => t.cat), 'var(--green)')}</div>
      <h3>Customers</h3><div class="card">${bars(groupBy(ins.filter(t => t.cust), t => t.cust), 'var(--accent)')}</div>
      ${S.set.gst ? `<h3>GST</h3><div class="grid">
        <div class="card"><div class="lbl">Collected on sales</div><div class="big">${fmt(gc)}</div></div>
        <div class="card"><div class="lbl">Paid on purchases</div><div class="big">${fmt(gp)}</div></div>
        <div class="card"><div class="lbl">${gc - gp >= 0 ? 'Owing' : 'Refund'}</div><div class="big">${fmt(Math.abs(gc - gp))}</div></div></div>` : ''}`;
    }
    return `<h2>Money in &amp; out</h2>
    <div class="row bar"><button class="btn in" onclick="addTx('in')">+ In</button><button class="btn out" onclick="addTx('out')">− Out</button><button class="btn sec" onclick="addMove()">⇄ Move</button></div>
    <div class="row bar"><select class="f" onchange="moneyFilter=this.value;render()">
      <option value="month" ${moneyFilter === 'month' ? 'selected' : ''}>This month</option>
      <option value="all" ${moneyFilter === 'all' ? 'selected' : ''}>Everything</option>
      ${months.filter(m => m !== thisMonth()).map(m => `<option value="${m}" ${moneyFilter === m ? 'selected' : ''}>${label(m)}</option>`).join('')}
    </select>
    <button class="btn sec sm" onclick="moneyView=moneyView==='list'?'break':'list';render()">${moneyView === 'list' ? '📊 Breakdown' : '📋 Entries'}</button>${eye()}</div>
    <div class="grid bar">
      <div class="card"><div class="lbl">In</div><div class="big pos">${fmt(i)}</div></div>
      <div class="card"><div class="lbl">Out</div><div class="big neg">${fmt(o)}</div></div>
      <div class="card"><div class="lbl">Difference</div><div class="big ${i - o < 0 ? 'neg' : 'pos'}">${fmt(i - o)}</div></div>
    </div>${body}`;
  },
  stock() {
    const items = [...S.items].sort((a, b) => a.name.localeCompare(b.name));
    return `<h2>Stock</h2>
    <div class="row bar"><button class="btn" onclick="editItem()">+ Add product</button>${eye()}</div>
    ${items.length ? items.map(i => { const isLow = i.low > 0 && i.qty <= i.low; return `<div class="card prod ${isLow ? 'low' : ''}">
      <div class="top"><div><div class="t" style="font-weight:700;font-size:17px">${esc(i.name)}</div>
        ${isLow ? '<div class="neg" style="font-weight:700;font-size:14px">⚠️ Low – time to restock</div>' : ''}
        <div class="mute">Cost ${fmt(i.cost)} · Sells ${fmt(i.price)}${i.price && i.cost ? ` · Profit ${fmt(i.price - i.cost)} each` : ''}</div>
        ${i.low > 0 ? `<div class="mute">Alert at ${i.low} or fewer</div>` : ''}</div>
        <div><div class="qty ${i.qty <= 0 ? 'neg' : ''}">${i.qty}</div><div class="mute" style="text-align:right">in stock</div></div></div>
      <div class="row" style="margin-top:12px"><button class="btn sm in" onclick="sell('${i.id}')">Sold</button><button class="btn sm" onclick="restock('${i.id}')">Restock</button>
        <button class="btn sm sec" onclick="editItem('${i.id}')">Edit</button><button class="btn sm sec" onclick="delItem('${i.id}')">Delete</button></div>
    </div>`; }).join('') : '<div class="card empty">No products yet. Tap “+ Add product”.</div>'}`;
  },
  debts() {
    const open = S.debts.filter(d => bal(d) > 0), closed = S.debts.filter(d => bal(d) <= 0);
    const card = d => `<div class="card prod">
      <div class="top"><div><div class="t" style="font-weight:700;font-size:17px">${esc(d.name)}</div>
        <div class="mute">${d.dir === 'owe' ? 'I owe them' : 'They owe me'} · started ${niceDate(d.date)}${d.note ? ' · ' + esc(d.note) : ''}</div>
        <div class="mute">Original ${fmt(d.amount)} · paid ${fmt(paid(d))}${(d.payments || []).length ? ` in ${d.payments.length} payment${d.payments.length > 1 ? 's' : ''}` : ''}</div></div>
        <div><div class="amt big ${bal(d) > 0 ? (d.dir === 'owe' ? 'neg' : 'pos') : ''}">${bal(d) > 0 ? fmt(bal(d)) : 'Paid ✓'}</div>${bal(d) > 0 ? '<div class="mute" style="text-align:right">left</div>' : ''}</div></div>
      <div class="row" style="margin-top:12px">${bal(d) > 0 ? `<button class="btn sm" onclick="payDebt('${d.id}')">Add payment</button>` : ''}
        <button class="btn sm sec" onclick="editDebt('${d.id}')">Edit</button><button class="btn sm sec" onclick="delDebt('${d.id}')">Delete</button></div></div>`;
    const owe = open.filter(d => d.dir === 'owe'), owed = open.filter(d => d.dir === 'owed');
    return `<h2>Debts</h2>
    <div class="row bar"><button class="btn" onclick="editDebt()">+ Add a debt</button>${eye()}</div>
    <h3>I owe (${fmt(sum(owe, bal))})</h3>${owe.length ? owe.map(card).join('') : '<div class="mute">Nothing owed. 👍</div>'}
    <h3>Owed to me (${fmt(sum(owed, bal))})</h3>${owed.length ? owed.map(card).join('') : '<div class="mute">Nobody owes you right now.</div>'}
    ${closed.length ? `<h3>Paid off</h3>${closed.map(card).join('')}` : ''}`;
  },
  more() {
    return `<h2>Backup &amp; settings</h2>
    <div class="card" style="margin-bottom:12px"><b>Businesses</b>
      <p class="mute">Now showing: <b>${esc(profName())}</b>. Keep separate books for each business.</p>
      <button class="btn" onclick="profiles()">Switch or add a business</button></div>
    <div class="card" style="margin-bottom:12px"><b>Back up “${esc(profName())}”</b>
      <p class="mute">Everything is saved inside this browser on this phone only. Nothing goes on the internet unless you share a backup yourself.</p>
      <p class="mute">Last backup: ${S.lastBackup ? niceDate(S.lastBackup) : 'never'}${S.dirty > 0 ? ` · ${S.dirty} change${S.dirty > 1 ? 's' : ''} since` : ''}</p>
      <div class="row"><button class="btn" onclick="backup()">💾 Back up now</button><button class="btn" onclick="shareBackup()">📤 Send backup</button><button class="btn sec" onclick="restore()">Restore</button></div>
      <p class="mute">“Send backup” opens your phone's share menu (Quick Share, email, etc.). ${SEC ? 'Backups are locked 🔒: they can only be opened with the PIN that was set when they were made.' : 'Backups are not locked, so only send them to yourself or someone you trust. Set a PIN below to lock them.'}</p>
      ${SEC ? '<p><button class="btn sec sm" onclick="backup(false,true)">Save an unlocked safety copy</button></p>' : ''}
      <label class="chk"><input type="checkbox" ${S.auto !== false ? 'checked' : ''} onchange="S.auto=this.checked;save()"> Auto backup: save a backup file to Downloads the first time I change something each day</label></div>
    <div class="card" style="margin-bottom:12px"><b>PIN lock</b>
      <p class="mute">${SEC ? 'PIN is ON 🔒. Your data and backups are encrypted. StockPile asks for the PIN when opened, and again after a minute away.' : LEGACY ? 'PIN is ON. StockPile asks for it when opened.' : 'Ask for a PIN before anything is shown' + (CAN ? ', and encrypt your data and backups with it.' : '.')}</p>
      <div class="row"><button class="btn" onclick="setPin()">${SEC || LEGACY ? 'Change PIN' : 'Set a PIN'}</button>${SEC || LEGACY ? '<button class="btn sec" onclick="removePin()">Remove PIN</button><button class="btn sec" onclick="lockNow()">🔒 Lock now</button>' : ''}</div>
      ${SEC ? (SEC.bio ? '<p class="mute">Fingerprint unlock is ON.</p><button class="btn sec" onclick="disableBio()">Turn off fingerprint</button>'
        : bioOK() ? '<p class="mute">Unlock with your fingerprint instead of typing the PIN.</p><button class="btn" onclick="enableBio()">Turn on fingerprint unlock</button>'
        : '<p class="mute">Fingerprint unlock is available in the installed app version.</p>') : ''}</div>
    <div class="card" style="margin-bottom:12px"><b>GST</b>
      <label class="chk"><input type="checkbox" ${S.set.gst ? 'checked' : ''} onchange="S.set.gst=this.checked;save();render()"> Track GST</label>
      ${S.set.gst ? `<div class="row"><span class="mute">Rate %</span><input class="f" type="number" step="0.1" min="0" style="width:90px" value="${S.set.gstRate}" onchange="S.set.gstRate=parseFloat(this.value)||5;save()"></div>
      <p class="mute">Entries get an “Amount includes GST” tick box. Totals show under Money → Breakdown.</p>` : '<p class="mute">Off. Turn it on if you ever need it.</p>'}</div>
    <div class="card" style="margin-bottom:12px"><b>Open in Excel</b>
      <p class="mute">Download your lists as files that Excel or Google Sheets can open.</p>
      <div class="row"><button class="btn sec" onclick="exportMoney()">Money list (.csv)</button><button class="btn sec" onclick="exportStock()">Stock list (.csv)</button></div></div>
    <div class="card"><b>Start over</b><p class="mute">Erases everything in the tracker.</p><button class="btn out" onclick="wipe()">Erase all data</button></div>`;
  }
};
function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#hdr').innerHTML = `<span>📦 StockPile</span><button onclick="profiles()">${esc(profName())} ▾</button>`;
  $('#view').innerHTML = V[tab]();
}
async function init() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (e) { storageOK = false; }
  if (raw && raw.sec && raw.body) { SEC = raw.sec; render(); showLock(); return; }
  if (raw && typeof raw === 'object') {
    P = Object.assign(defaultP(), { list: raw.list, current: raw.current });
    if (typeof raw.pin === 'string' && /^[a-z0-9]{1,16}$/.test(raw.pin)) LEGACY = raw.pin;
  }
  sanitizeP(); await loadProfile(); render();
  if (LEGACY) showLock();
}
const ready = init();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
